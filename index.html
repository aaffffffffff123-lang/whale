
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>고래</title>
<style>
  :root{
    --ink:#173a4c; --line:#24596f;
    --amber:#f5a51d; --amber-dk:#c1780a;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    background:#9fd6ea;color:var(--ink);display:flex;justify-content:center;}
  #stage{position:relative;width:100%;max-width:620px;height:100%;display:flex;flex-direction:column;}
  #gl{position:absolute;inset:0;}
  #gl canvas{display:block;width:100%;height:100%;}

  #topbar{position:absolute;top:0;left:0;right:0;z-index:8;
    display:flex;align-items:center;gap:8px;padding:14px 16px;}
  .pill{background:var(--panel);border:3px solid var(--line);border-radius:999px;
    padding:6px 15px;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);
    box-shadow:0 3px 0 rgba(36,89,111,.35);cursor:pointer;}
  #score{cursor:default;} #score b{font-size:19px;margin-left:6px;}
  #spacer{flex:1;}
  #mute{padding:6px 12px;font-size:15px;}
  #reset.hot{background:var(--amber);color:#fff;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}

  #combo{position:absolute;top:60px;right:16px;z-index:8;pointer-events:none;
    font-weight:900;color:#fff;text-shadow:0 0 6px rgba(36,89,111,.55),0 3px 0 var(--line);
    opacity:0;transition:opacity .25s;line-height:1;text-align:right;}
  #combo i{font-style:normal;font-size:.4em;display:block;letter-spacing:.15em;}

  #fallzone{position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;overflow:hidden;}
  .ln{position:absolute;font-weight:800;font-size:15px;line-height:1.35;
    padding:6px 13px;border-radius:16px;text-align:center;
    background:rgba(255,255,255,.94);border:2.5px solid var(--line);
    color:var(--ink);box-shadow:0 3px 0 rgba(36,89,111,.28);
    transform:translateX(-50%);will-change:top;}
  .ln.long{font-size:13.5px;}
  .ln.lock{border-color:var(--amber-dk);
    box-shadow:0 0 0 4px rgba(245,165,29,.45),0 3px 0 rgba(36,89,111,.28);}
  .ln .done{color:#c1780a;}
  .ln.hitfx{animation:hit .3s ease-out forwards;}
  @keyframes hit{to{transform:translateX(-50%) scale(1.5);opacity:0;}}
  .ln.sink{transition:opacity .9s ease-out, transform .9s ease-in;}
  .ln.flat{background:rgba(255,255,255,.6);border-color:rgba(36,89,111,.3);
    box-shadow:none;color:rgba(23,58,76,.55);font-weight:700;}

  #bottom{margin-top:auto;padding:0 16px 16px;z-index:8;position:relative;}
  #gauge{height:26px;background:#fff;border:3px solid var(--line);border-radius:999px;
    overflow:hidden;box-shadow:0 3px 0 rgba(36,89,111,.35);}
  #gfill{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(var(--amber),var(--amber-dk));transition:width .18s linear;}
  #row{display:flex;gap:10px;margin-top:12px;}
  #input{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    padding:12px 16px;background:var(--panel);border:3px solid var(--line);border-radius:14px;
    box-shadow:0 3px 0 rgba(36,89,111,.35);transition:border-color .12s;}
  #input::placeholder{color:rgba(23,58,76,.3);font-weight:600;}
  #input:focus{outline:none;border-color:var(--amber-dk);}
  #input.nomatch{border-color:#c0392b;}
  #input:disabled{background:#eef2f4;}
  #clear{font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--line);
    border:3px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;
    box-shadow:0 3px 0 rgba(36,89,111,.35);}
  #clear:active{transform:translateY(3px);box-shadow:none;}

  #splats{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;}
  .splat{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 38% 34%, rgba(255,255,255,.98), rgba(214,238,247,.85) 55%, rgba(214,238,247,0) 72%);}
</style>
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="fallzone"></div>
  <div id="splats"></div>

  <div id="topbar">
    <div class="pill" id="score">받은 문장<b id="scoreNum">0</b></div>
    <div id="spacer"></div>
    <button class="pill" id="mute" type="button">🔊</button>
    <button class="pill" id="reset" type="button">처음부터</button>
  </div>
  <div id="combo"><i>COMBO</i><span id="comboNum">0</span></div>

  <div id="bottom">
    <div id="gauge"><div id="gfill"></div></div>
    <div id="row">
      <input id="input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="떨어지는 문장을 그대로 치세요">
      <button id="clear" type="button">지우기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

/* ══════════════════════════════════════════════════════════

/* ── 난이도 ──
   낙하 시간 = FALL_BASE + 글자수 * FALL_PER_CHAR, 후반에 FALL_TIGHTEN 배까지 줄어듦 */
var FALL_BASE = 6.5, FALL_PER_CHAR = 0.85, FALL_TIGHTEN = 0.80;
/* 동시에 떠 있는 문장 수 (처음 → 끝) */
var MAX_ON_EARLY = 3, MAX_ON_LATE = 6;

var RAMP = 180;


/* ════════ 오디오 ════════ */
var AC=null, master=null, noiseBuf=null, engine=null, muted=false;
function audioInit(){
  if (AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
  var len = AC.sampleRate*2;
  noiseBuf = AC.createBuffer(1,len,AC.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var s = AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=0.4;
  var g = AC.createGain(); g.gain.value=0.055;
  s.connect(lp); lp.connect(g); g.connect(master); s.start();
}
function unlock(){ audioInit(); if (AC && AC.state==='suspended') AC.resume(); }
document.addEventListener('pointerdown', unlock);

function sfxSplash(power,bright){
  if(!AC||muted) return;
  power=Math.max(0.25,Math.min(2.6,power));
  var t=AC.currentTime, dur=0.22+power*0.34;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.65;
  bp.frequency.setValueAtTime((bright?4200:2600)*Math.min(1.4,power),t);
  bp.frequency.exponentialRampToValueAtTime(180,t+dur);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.55,0.20*power),t+0.014);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.06);
}
function sfxCall(base,dur,glide,vol){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='sine';
  var o2=AC.createOscillator(); o2.type='triangle';
  var g=AC.createGain(), g2=AC.createGain();
  o.frequency.setValueAtTime(base,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,base*glide),t+dur);
  o2.frequency.setValueAtTime(base*2.005,t);
  o2.frequency.exponentialRampToValueAtTime(Math.max(60,base*2.005*glide),t+dur);
  g2.gain.value=0.3; o2.connect(g2); g2.connect(g);
  var lfo=AC.createOscillator(); lfo.frequency.value=5.2;
  var lg=AC.createGain(); lg.gain.value=base*0.045;
  lfo.connect(lg); lg.connect(o.frequency); o.connect(g);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.30,t+0.09);
  g.gain.setValueAtTime(vol||0.30,t+dur*0.62);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(master);
  o.start(t);o2.start(t);lfo.start(t);
  o.stop(t+dur+0.06);o2.stop(t+dur+0.06);lfo.stop(t+dur+0.06);
}
function sfxBlip(n){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(392*Math.pow(2,Math.min(n,24)/12),t);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.13,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2);
}
function sfxMiss(){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(700,t);
  lp.frequency.exponentialRampToValueAtTime(140,t+0.4);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.11,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
  s.connect(lp); lp.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.5);
}
function sfxThud(){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(900,t);
  lp.frequency.exponentialRampToValueAtTime(90,t+0.22);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.5,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  s.connect(lp); lp.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.32);
}
function startEngine(){
  if(!AC||engine) return;
  var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=58;
  var lfo=AC.createOscillator(); lfo.frequency.value=7.5;
  var lg=AC.createGain(); lg.gain.value=5;
  lfo.connect(lg); lg.connect(o.frequency);
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=240;
  var g=AC.createGain(); g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(0.13,AC.currentTime+1.6);
  o.connect(lp); lp.connect(g); g.connect(master);
  o.start(); lfo.start();
  engine={o:o,lfo:lfo};
}
function stopEngine(){ if(!engine) return; try{engine.o.stop();engine.lfo.stop();}catch(e){} engine=null; }


/* ════════ 악플 감지 (이스터에그) ════════ */
var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var TENSE={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ','ㅄ':'ㅂㅅ','ㄳ':'ㄱㅅ'};
function soften(j){ return TENSE[j]||j; }
function jnorm(text){
  var src=String(text).toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g,''), out='';
  for(var i=0;i<src.length;i++){
    var c=src.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3){
      var v=c-0xAC00, cho=CHO[Math.floor(v/588)], ju=JUNG[Math.floor((v%588)/28)], jo=JONG[v%28];
      if(cho!=='ㅇ') out+=soften(cho);
      out+=ju; if(jo) out+=soften(jo);
    } else out+=soften(src[i]);
  }
  return out.replace(/(.)\1+/g,'$1');
}
function chosung(text){
  var src=String(text).toLowerCase().replace(/[^가-힣ㄱ-ㅎ]/g,''), out='';
  for(var i=0;i<src.length;i++){
    var c=src.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3) out+=soften(CHO[Math.floor((c-0xAC00)/588)]);
    else out+=soften(src[i]);
  }
  return out.replace(/(.)\1+/g,'$1');
}
function looseRatio(t){
  var s=String(t).replace(/\s+/g,'');
  if(!s.length) return 0;
  var m=s.match(/[ㄱ-ㅎㅏ-ㅣ]/g);
  return m?m.length/s.length:0;
}
var BAD_WORDS=['시발','씨발','시팔','씹','좆','병신','븅신','새끼','개새','지랄','꺼져','닥쳐',
  '등신','멍청','바보','또라이','한심','쓰레기','역겨','더러워','징그러',
  '죽어','죽여','뒤져','뒈져','자살','없어져','사라져','못생','뚱뚱','노잼','짜증','최악'];
var BAD=BAD_WORDS.map(function(w){return {raw:w,key:jnorm(w)};});
var BAD_CHO=['ㅅㅂ','ㅂㅅ','ㅈㄹ','ㄲㅈ','ㄷㅊ','ㄱㅅㄲ'].map(function(w){return {raw:w,key:chosung(w)};});
function detectBad(t){
  var n=jnorm(t);
  for(var i=0;i<BAD.length;i++) if(BAD[i].key&&n.indexOf(BAD[i].key)!==-1) return BAD[i].raw;
  // 초성 약자는 정말로 낱자모를 치고 있을 때만 본다 (조합 중인 글자로는 안 열림)
  if(looseRatio(t)>=0.4){
    var c=chosung(t);
    for(var j=0;j<BAD_CHO.length;j++) if(BAD_CHO[j].key&&c.indexOf(BAD_CHO[j].key)!==-1) return BAD_CHO[j].raw;
  }
  return null;
}


/* ════════ 3D ════════ */
var host=document.getElementById('gl');
var scene,camera,renderer,water,waterBase,whale,whaleBody,tailPivot,finPivots=[];
var splash,splashData=[],rings=[],boat=null,throwers=[],rocks=[],shake=0,squash=0;
var SPLASH_MAX=2600, RING_MAX=12;
var SKY_LIVE=new THREE.Color(0xc4e9f6), SKY_DEAD=new THREE.Color(0xf4fbfd);
var SEA_LIVE=new THREE.Color(0x4fb6de), SEA_DEAD=new THREE.Color(0xa9d8e8);

function init3D(){
  scene=new THREE.Scene();
  scene.background=SKY_LIVE.clone();
  scene.fog=new THREE.Fog(SKY_LIVE.getHex(),60,200);
  camera=new THREE.PerspectiveCamera(52,1,0.1,500);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  host.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x74b7d6,1.1));
  var sun=new THREE.DirectionalLight(0xffffff,0.8);
  sun.position.set(-14,30,18); scene.add(sun);

  var wg=new THREE.PlaneGeometry(420,420,120,120);
  wg.rotateX(-Math.PI/2);
  waterBase=Float32Array.from(wg.attributes.position.array);
  water=new THREE.Mesh(wg,new THREE.MeshPhongMaterial({
    color:SEA_LIVE.clone(),transparent:true,opacity:0.66,
    shininess:100,specular:0xffffff,side:THREE.DoubleSide}));
  scene.add(water);

  var floor=new THREE.Mesh(new THREE.PlaneGeometry(420,420),
    new THREE.MeshBasicMaterial({color:0x2a7ea6}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-30; scene.add(floor);

  buildWhale(); buildSplash(); buildRings(); onResize();
}

function buildWhale(){
  whale=new THREE.Group(); whaleBody=new THREE.Group();
  whale.add(whaleBody); scene.add(whale);
  var g=new THREE.SphereGeometry(1,56,36);
  var pos=g.attributes.position;
  var colors=new Float32Array(pos.count*3);
  var top=new THREE.Color(0x3f6f8d),belly=new THREE.Color(0xe2f0f7),c=new THREE.Color();
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    var t=(z+1)/2,r;
    if(t<0.16) r=0.70+0.30*(t/0.16);
    else r=1-Math.pow((t-0.16)/0.84,1.9)*0.94;
    pos.setXYZ(i,x*r*0.62,y*r*0.54,z*1.85);
    var amt=Math.max(0,Math.min(1,(-y-0.02)/0.5));
    c.copy(top).lerp(belly,amt);

function kf(u,pts){
  for(var i=0;i<pts.length-1;i++){
    if(u<=pts[i+1][0]){
      var a=pts[i],b=pts[i+1];
      var k=(u-a[0])/((b[0]-a[0])||1); k=k*k*(3-2*k);
      return a[1]+(b[1]-a[1])*k;
    }
  }
  return pts[pts.length-1][1];
}

function pickMoves(combo){
  if(combo<=1) return ['SLAP'];
  if(combo===2) return ['STAND'];
  if(combo===3) return ['ROLL','STAND'];

// 짧은 문장부터 시작해서 진행할수록 긴 문장이 섞인다
function drawLine(prog){
  if(!SORTED) SORTED=LINES.slice().sort(function(a,b){ return nsp(a).length-nsp(b).length; });
  var n=SORTED.length;
  var maxIdx=Math.max(5, Math.round(n*(0.32+0.68*prog)));
  var pick, tries=0;
  do{
    pick=SORTED[Math.floor(Math.random()*maxIdx)];
    tries++;
  } while(recent.indexOf(pick)!==-1 && tries<25);
  recent.push(pick);
  if(recent.length>Math.min(12,n-2)) recent.shift();
  return pick;
}

function spawnLine(){
  var prog=progress();
  var text=drawLine(prog);
  var chars=nsp(text).length;

  var d=document.createElement('div');
  d.className='ln'+(chars>=18?' long':'');
  d.textContent=text;
  d.style.top='-60px';
  d.style.left='50%';
  d.style.maxWidth='86%';
  d.style.whiteSpace = chars>=15 ? 'normal' : 'nowrap';
  el.zone.appendChild(d);

  // 실제 너비를 재서 화면 밖으로 안 나가는 위치에 놓는다
  var zw=el.zone.clientWidth||360;
  var half=(d.offsetWidth/2/zw)*100;
  var lo=half+2, hi=98-half;
  if(hi<lo){ lo=hi=50; }
  d.style.left=(lo+Math.random()*(hi-lo)).toFixed(2)+'%';

  var dur=(FALL_BASE + chars*FALL_PER_CHAR) * (1-(1-FALL_TIGHTEN)*prog);
  var span=WATERLINE+60;
  falls.push({el:d, text:text, norm:nsp(text), y:-60, speed:span/dur, done:false});
}

function maxOnScreen(){
  return Math.round(MAX_ON_EARLY+(MAX_ON_LATE-MAX_ON_EARLY)*progress());
}

function updateMatch(){
  var v=nsp(el.input.value);
  var target=null;
  if(v.length){
    for(var i=0;i<falls.length;i++){
      var f=falls[i];
      if(f.done) continue;
      if(f.norm.indexOf(v)===0){
        if(!target || f.y>target.y) target=f;   // 더 급한 것 우선
      }
    }
  }
  el.input.classList.toggle('nomatch', v.length>0 && !target);

  for(var j=0;j<falls.length;j++){
    var g=falls[j];
    if(g.done) continue;
    if(g===target){
      g.el.classList.add('lock');
      var n=0,cut=0;
      while(cut<g.text.length && n<v.length){
        if(g.text[cut]!==' ') n++;
        cut++;
      }
      g.el.innerHTML='<span class="done"></span><span></span>';
      g.el.firstChild.textContent=g.text.slice(0,cut);
      g.el.lastChild.textContent=g.text.slice(cut);
    } else if(g.el.classList.contains('lock')){
      g.el.classList.remove('lock');
      g.el.textContent=g.text;
    }
  }

  if(target && v===target.norm) complete(target);
  return target;
}

function complete(f){
  f.done=true;
  f.el.classList.remove('lock');
  f.el.classList.add('hitfx');
  var node=f.el;
  setTimeout(function(){ node.remove(); },320);
  falls.splice(falls.indexOf(f),1);
  el.input.value=''; el.input.classList.remove('nomatch');

  S.score++; S.combo++;
  if(S.combo>S.best) S.best=S.combo;
  if(S.combo>=2) sfxBlip(S.combo);

  var mv=pickMoves(S.combo);
  for(var i=0;i<mv.length;i++){
    if(S.queue.length>=8) break;
    S.queue.push(mv[i]);
  }
  paint();
}

function missLine(f){
  f.done=true;
  f.el.classList.remove('lock');
  falls.splice(falls.indexOf(f),1);
  if(S.dead){
    // 아무도 받지 않는다 — 수면에 눕는다
    f.el.classList.add('flat');
    f.el.style.top=(WATERLINE-10+Math.random()*30)+'px';
    f.el.style.transform='translateX(-50%) rotate('+((Math.random()-0.5)*9).toFixed(1)+'deg)';
    deadPile.push({el:f.el, x:parseFloat(f.el.style.left), vx:(Math.random()-0.5)*0.4});
    if(deadPile.length>16){
      var g=deadPile.shift();
      g.el.style.transition='opacity 2s'; g.el.style.opacity='0';
      setTimeout(function(){ g.el.remove(); },2100);
    }
    return;
  }
  f.el.classList.add('sink');
  f.el.style.opacity='0';
  f.el.style.transform='translateX(-50%) translateY(28px) scale(.92)';
  var node=f.el;
  setTimeout(function(){ node.remove(); },950);
  S.combo=0; sfxMiss(); paint();
}

function die(){
  S.dead=true;
  S.queue.length=0; S.cur=null; S.combo=0;
  el.input.value=''; el.input.disabled=true;
  el.input.classList.remove('nomatch');
  falls.forEach(function(f){ f.el.classList.remove('lock'); f.el.textContent=f.text; });
  sfxCall(300,3.6,0.16,0.34);
  setTimeout(function(){ sfxSplash(2.2,false); },320);
  setTimeout(function(){ el.reset.classList.add('hot'); },4200);
  paint();
}

function startRaid(){
  S.raid=1; S.raidT=0; S.nextThrow=2.5; S.dead=true;
  S.queue.length=0; S.cur=null; S.combo=0;
  el.input.disabled=true;
  if(!boat) boat=buildBoat();
  startEngine();
  setTimeout(function(){ el.reset.classList.add('hot'); },3200);
  paint();
}


/* ════════ 루프 ════════ */
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  S.t+=dt;
  if(!S.dead) S.run+=dt;

  if(!S.raid){
    S.spawnT-=dt;
    if(S.spawnT<=0){
      if(falls.length<maxOnScreen()){
        spawnLine();
        var gap=GAP_SLOW+(GAP_FAST-GAP_SLOW)*progress();
        S.spawnT=gap*(0.8+Math.random()*0.4);
      } else {
        S.spawnT=0.4;   // 꽉 찼으면 잠깐 뒤 다시 확인
      }
    }
  }

  for(var i=falls.length-1;i>=0;i--){
    var f=falls[i];
    f.y+=f.speed*dt;
    f.el.style.top=f.y+'px';
    if(f.y>=WATERLINE) missLine(f);
  }
  for(var dpi=0;dpi<deadPile.length;dpi++){
    var dp=deadPile[dpi];
    dp.x+=dp.vx*dt;
    dp.el.style.left=dp.x+'%';
  }

  var perf=0,cost=0;
  if(!S.dead){
    if(!S.cur&&S.queue.length){
      S.cur=S.queue.shift(); S.curT=0;
      S.o={x:whale.position.x,z:whale.position.z,y:REST_Y,
           pitch:0,roll:0,lean:0,yawSpin:0,rollSpin:0,tail:0,finWave:0,seg:-1};
    }
    if(S.cur){
      var M=MOVES[S.cur]; S.curT+=dt;
      var u=Math.min(1,S.curT/M.dur);
      S.o.yawSpin=0;S.o.rollSpin=0;S.o.tail=0;S.o.finWave=0;S.o.lean=0;S.o.roll=0;
      M.run(u,S.o,dt);
      perf=1; cost=M.cost;
      if(u>=1) S.cur=null;
    }
  }

  if(!S.dead){
    var mult=1+Math.min(15,S.combo)*0.075;
    S.gauge=Math.max(0,Math.min(100,S.gauge+(perf?3.6*cost*mult:-1.0)*dt));
    if(S.gauge>=100) die();
    paint();
  }

  if(!S.dead){
    S.nextBlow-=dt;
    if(S.nextBlow<=0){ blow(); S.nextBlow=5.5+Math.random()*3.5; }
  }

  if(S.dead && !S.raid){
    S.wash=Math.min(1,S.wash+dt*0.10);
    scene.background.copy(SKY_LIVE).lerp(SKY_DEAD,S.wash);
    scene.fog.color.copy(SKY_LIVE).lerp(SKY_DEAD,S.wash);
    scene.fog.near=60-S.wash*46;
    scene.fog.far=200-S.wash*128;
    water.material.color.copy(SEA_LIVE).lerp(SEA_DEAD,S.wash);
    water.material.opacity=0.66-S.wash*0.18;
  }

  var wp=water.geometry.attributes.position;
  var amp=S.dead?0.45:(1+(perf?0.9:0));
  for(var wi=0;wi<wp.count;wi++){
    var bx=waterBase[wi*3],bz=waterBase[wi*3+2];
    var dd=Math.sqrt(bx*bx+bz*bz);
    wp.array[wi*3+1]=
      (Math.sin(bx*0.16+S.t*1.3)*0.34
      +Math.sin(bz*0.21-S.t*1.0)*0.30
      +Math.sin(dd*0.30-S.t*2.2)*0.26*(1-Math.min(1,dd/45)))*amp;
  }
  wp.needsUpdate=true;
  water.geometry.computeVertexNormals();

  squash=Math.max(0,squash-dt*3.2);
  if(S.raid){
    whale.position.y+=(-5.4-whale.position.y)*Math.min(1,dt*1.1);
    whaleBody.rotation.x*=(1-Math.min(1,dt*3));
    whaleBody.rotation.z*=(1-Math.min(1,dt*3));
    tailPivot.rotation.x*=(1-Math.min(1,dt*3));
  } else if(S.dead){
    S.flip+=(Math.PI-S.flip)*Math.min(1,dt*0.85);
    whale.position.y+=(-0.25-whale.position.y)*Math.min(1,dt*0.7);
    whale.position.x+=(0-whale.position.x)*Math.min(1,dt*0.7);
    whale.rotation.y+=(0-whale.rotation.y)*Math.min(1,dt*0.7);
    whale.rotation.z+=(0-whale.rotation.z)*Math.min(1,dt*0.7);
    whaleBody.rotation.set(Math.sin(S.t*0.42)*0.035,0,S.flip);
    tailPivot.rotation.x=Math.sin(S.t*0.42)*0.04;
    finPivots.forEach(function(fp){ fp.pv.rotation.z+=(0-fp.pv.rotation.z)*Math.min(1,dt*2); });
  } else if(S.cur){
    var o=S.o;
    S.yaw+=o.yawSpin; S.roll+=o.rollSpin;
    whale.position.set(o.x,o.y,o.z);
    whale.rotation.y=S.yaw; whale.rotation.z=o.lean||0;
    whaleBody.rotation.x=o.pitch;
    whaleBody.rotation.z=S.roll+(o.roll||0);
    tailPivot.rotation.x=o.tail;
    finPivots.forEach(function(fp){
      fp.pv.rotation.z=o.finWave?-fp.s*(0.4+0.9*Math.sin(S.t*16))*o.finWave:0;
    });
  } else {
    S.swim+=dt*0.75;
    whale.position.y+=(REST_Y+Math.sin(S.swim*1.3)*0.5-whale.position.y)*Math.min(1,dt*2.2);
    whale.position.x+=(Math.sin(S.swim*0.55)*3.5-whale.position.x)*Math.min(1,dt*1.4);
    S.yaw+=(Math.sin(S.swim*0.55+1.57)*0.45-S.yaw)*Math.min(1,dt*1.6);
    S.roll+=(0-S.roll)*Math.min(1,dt*2.2);
    whale.rotation.y=S.yaw;
    whale.rotation.z+=(0-whale.rotation.z)*Math.min(1,dt*3);
    whaleBody.rotation.x+=(Math.sin(S.swim*1.3+1)*0.10-whaleBody.rotation.x)*Math.min(1,dt*3);
    whaleBody.rotation.z+=(S.roll-whaleBody.rotation.z)*Math.min(1,dt*3);
    tailPivot.rotation.x=Math.sin(S.swim*Math.PI*2)*0.32;
    finPivots.forEach(function(fp){ fp.pv.rotation.z+=(0-fp.pv.rotation.z)*Math.min(1,dt*4); });
  }
  whaleBody.scale.set(1+squash*0.20,1-squash*0.24,1+squash*0.10);

  var sp=splash.geometry.attributes.position;
  for(var k=0;k<SPLASH_MAX;k++){
    var p=splashData[k];
    if(!p.live){ sp.array[k*3+1]=-999; continue; }
    p.life+=dt;
    if(p.life>=p.max){ p.live=false; sp.array[k*3+1]=-999; continue; }
    p.vy-=18*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.y<0&&p.vy<0){ p.live=false; sp.array[k*3+1]=-999; continue; }
    sp.array[k*3]=p.x; sp.array[k*3+1]=p.y; sp.array[k*3+2]=p.z;
  }
  sp.needsUpdate=true;

  for(var q=0;q<RING_MAX;q++){
    var rr=rings[q];
    if(!rr.live) continue;
    rr.t+=dt;
    var kk=rr.t/rr.max;
    if(kk>=1){ rr.live=false; rr.mesh.visible=false; continue; }
    rr.mesh.scale.setScalar(0.6+kk*rr.grow);
    rr.mesh.material.opacity=0.55*(1-kk);
  }

  if(S.raid&&boat){
    S.raidT+=dt;
    var k2=Math.min(1,S.raidT/2.4),ease=1-Math.pow(1-k2,3);
    boat.position.x=36+(7-36)*ease;
    boat.position.z=-50+(14+50)*ease;
    boat.rotation.y=-0.5+0.35*ease;
    boat.position.y=Math.sin(S.t*2.2)*0.24;
    boat.rotation.z=Math.sin(S.t*1.7)*0.06;
    throwers.forEach(function(pp,ii){
      pp.rotation.z=Math.sin(S.t*10+pp.userData.ph)*0.26;
      pp.rotation.y=Math.sin(S.t*4.5+ii)*0.34;
    });
    if(S.raidT>2.2){
      S.nextThrow-=dt;
      if(S.nextThrow<=0){
        throwRock(throwers[Math.floor(Math.random()*throwers.length)]);
        S.nextThrow=0.42+Math.random()*0.45;
      }
    }
  }
  for(var r=rocks.length-1;r>=0;r--){
    var ro=rocks[r];
    ro.t+=dt; ro.vy-=16*dt;
    ro.mesh.position.x+=ro.vx*dt;
    ro.mesh.position.y+=ro.vy*dt;
    ro.mesh.position.z+=ro.vz*dt;
    ro.mesh.rotation.x+=ro.spin.x*dt;
    ro.mesh.rotation.y+=ro.spin.y*dt;
    if(ro.t>=ro.max){ scene.remove(ro.mesh); rocks.splice(r,1); shake=1; popSplat(); sfxThud(); }
  }

  shake=Math.max(0,shake-dt*2.0);
  var sx=(Math.random()-0.5)*shake*2.4, sy=(Math.random()-0.5)*shake*2.4;
  var wy=Math.max(0,whale.position.y);
  camera.position.set(sx,8.5+wy*0.30+sy,34);
  camera.lookAt(whale.position.x*0.35+sx*0.4,2.5+wy*0.42,0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}


/* ════════ 입력 ════════ */
el.input.addEventListener('input',function(){
  unlock();
  if(S.dead) return;
  var matched=updateMatch();
  // 대본에서 벗어난 입력일 때만 악플을 본다
  if(!matched && nsp(el.input.value).length>=2){
    if(detectBad(el.input.value)) startRaid();
  }
});
el.input.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); el.input.value=''; updateMatch(); }
  if(ev.key==='Escape'){ el.input.value=''; updateMatch(); }
});
el.clear.addEventListener('click',function(){
  el.input.value=''; updateMatch(); el.input.focus();
});
el.reset.addEventListener('click',function(){ unlock(); reset(); el.input.focus(); });
el.mute.addEventListener('click',function(){
  unlock(); muted=!muted;
  if(master) master.gain.value=muted?0:0.85;
  el.mute.textContent=muted?'🔇':'🔊';
});

init3D(); reset(); requestAnimationFrame(loop);

})();
</script>
