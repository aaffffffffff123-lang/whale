<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>고래</title>
<style>
  :root{
    --ink:#173a4c; --line:#24596f;
    --amber:#f5a51d; --amber-dk:#c1780a;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  /* 키패드가 올라오면 --vh 를 줄여서 판이 가려지지 않게 합니다 */
  #wrap{height:var(--vh,100%);width:100%;display:flex;justify-content:center;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    background:#9fd6ea;color:var(--ink);display:flex;justify-content:center;}
  #stage{position:relative;width:100%;max-width:620px;height:100%;display:flex;flex-direction:column;}
  #gl{position:absolute;inset:0;}
  #gl canvas{display:block;width:100%;height:100%;}

  #topbar{position:absolute;top:0;left:0;right:0;z-index:8;
    display:flex;align-items:center;gap:8px;padding:14px 16px;}
  .pill{background:var(--panel);border:3px solid var(--line);border-radius:999px;
    padding:6px 15px;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);
    box-shadow:0 3px 0 rgba(36,89,111,.35);cursor:pointer;}
  #score{cursor:default;} #score b{font-size:19px;margin-left:6px;}
  #score .lbl{margin-right:0;}
  #clock{cursor:default;} #clock b{font-size:17px;}
  #topbar>*{flex:none;}
  @media (max-width:400px){
    .pill{padding:6px 11px;font-size:13px;}
    #score .lbl{display:none;}
    #score b{margin-left:0;}
  }
  #spacer{flex:1;}
  #mute{padding:6px 12px;font-size:15px;}
  #reset.hot{background:var(--amber);color:#fff;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}

  #combo{position:absolute;left:18px;bottom:112px;z-index:8;pointer-events:none;
    font-weight:900;color:#fff;text-shadow:0 0 6px rgba(36,89,111,.55),0 3px 0 var(--line);
    opacity:0;transition:opacity .25s;line-height:1;text-align:left;}
  #combo i{font-style:normal;font-size:.4em;display:block;letter-spacing:.15em;}
  #combo span{display:block;will-change:transform;}
  #combo.punch span{animation:cpunch .26s cubic-bezier(.2,1.6,.4,1);}
  @keyframes cpunch{0%{transform:scale(1.55) rotate(-4deg);}60%{transform:scale(.94);}100%{transform:scale(1);}}
  /* 콤보 유지 시간. 이게 다 닳으면 콤보가 풀립니다 */
  #cbar{display:block;font-size:14px;width:96px;height:8px;margin-top:9px;border-radius:999px;
    background:rgba(255,255,255,.45);box-shadow:0 0 0 2.5px rgba(36,89,111,.4);overflow:hidden;}
  #cbar b{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#ffd257,var(--amber),#ff6a2c);}
  #combo.low #cbar b{animation:cblink .28s steps(2,end) infinite;}
  @keyframes cblink{50%{opacity:.25;}}

  #fallzone{position:absolute;left:0;right:0;top:56px;z-index:6;pointer-events:none;overflow:hidden;}
  .ln{position:absolute;font-weight:800;font-size:14px;line-height:1.3;
    padding:4px 11px;border-radius:14px;text-align:center;
    background:rgba(255,255,255,.94);border:2.5px solid var(--line);
    color:var(--ink);box-shadow:0 3px 0 rgba(36,89,111,.28);
    transform:translateX(-50%);will-change:top;}
  .ln.long{font-size:12.5px;}
  .ln.lock{border-color:var(--amber-dk);
    box-shadow:0 0 0 4px rgba(245,165,29,.45),0 3px 0 rgba(36,89,111,.28);}
  .ln .done{color:#c1780a;}
  /* 완성한 문장은 껍데기가 벗겨지고 글자가 낱개로 튑니다 */
  .ln.pop{background:rgba(255,255,255,0);border-color:rgba(245,165,29,0);box-shadow:none;
    transition:background .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out;}
  .ln .ch{display:inline-block;color:var(--amber-dk);
    text-shadow:0 2px 0 rgba(255,255,255,.95),0 0 10px rgba(255,196,90,.9);
    transition:transform .58s cubic-bezier(.16,.85,.3,1), opacity .58s ease-out;}
  .ln.sink{transition:opacity .9s ease-out, transform .9s ease-in;}
  .ln.flat{background:rgba(255,255,255,.6);border-color:rgba(36,89,111,.3);
    box-shadow:none;color:rgba(23,58,76,.55);font-weight:700;}

  .hitring{position:absolute;pointer-events:none;width:70px;height:70px;border-radius:999px;
    border:5px solid rgba(245,165,29,.9);
    transform:translate(-50%,-50%) scale(.35);opacity:.95;
    transition:transform .52s cubic-bezier(.12,.9,.28,1), opacity .52s ease-out;}

  #flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 60%, rgba(255,255,255,.97),
      rgba(255,232,176,.62) 42%, rgba(255,208,120,0) 76%);}
  /* 콤보가 붙으면 화면 테두리가 달아오릅니다 */
  #glow{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 100px 26px rgba(255,158,40,.6);}

  #bottom{margin-top:auto;padding:0 16px 16px;z-index:8;position:relative;}
  #gauge.near{animation:gpulse .7s ease-in-out infinite;}
  @keyframes gpulse{50%{box-shadow:0 0 0 4px rgba(192,57,43,.28);}}
  #gauge{height:26px;background:#fff;border:3px solid var(--line);border-radius:999px;
    overflow:hidden;box-shadow:0 3px 0 rgba(36,89,111,.35);}
  #gfill{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(var(--amber),var(--amber-dk));transition:width .18s linear;}
  #row{display:flex;gap:10px;margin-top:12px;}
  #input{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    padding:12px 16px;background:var(--panel);border:3px solid var(--line);border-radius:14px;
    box-shadow:0 3px 0 rgba(36,89,111,.35);transition:border-color .12s;}
  #input::placeholder{color:rgba(23,58,76,.3);font-weight:600;}
  #input:focus{outline:none;border-color:var(--amber-dk);}
  #input.nomatch{border-color:#c0392b;}
  #input:disabled{background:#eef2f4;}
  #input[readonly]{background:#eef2f4;caret-color:transparent;}
  #clear{font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--line);
    border:3px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;
    box-shadow:0 3px 0 rgba(36,89,111,.35);}
  #clear:active{transform:translateY(3px);box-shadow:none;}

  .veil{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(214,238,247,.93);padding:18px;}
  .veil.on{display:flex;}
  .card{width:min(340px,90vw);max-height:80vh;overflow:auto;background:#fff;
    border:3px solid var(--line);border-radius:18px;padding:20px 18px 16px;text-align:center;
    box-shadow:0 6px 0 rgba(36,89,111,.3);}
  .card h2{margin:0 0 14px;font-size:21px;color:var(--ink);}
  .big{font-size:44px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-1px;}
  .big small{font-size:17px;margin-left:2px;}
  .sub{margin-top:8px;font-size:14px;font-weight:700;color:rgba(23,58,76,.6);}
  .btn{margin-top:6px;padding:13px 22px;border:3px solid var(--line);border-radius:14px;
    background:#fff;font-family:inherit;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;}
  .btn.hot{background:linear-gradient(var(--amber),var(--amber-dk));}
  .btn:active{transform:translateY(3px);}
  .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .modes{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  .modes .btn{flex:1;}
  .modes .btn.sel{background:linear-gradient(var(--amber),var(--amber-dk));}
  #wname{width:100%;margin-top:14px;padding:11px 12px;border:3px solid var(--line);
    border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;
    color:var(--ink);text-align:center;background:#fff;}
  .rk{display:flex;align-items:baseline;gap:8px;padding:8px 4px;font-size:15px;font-weight:700;
    color:rgba(23,58,76,.75);border-bottom:2px solid rgba(36,89,111,.12);}
  .rk:last-child{border-bottom:none;}
  .rk.me{background:#fff6d8;}
  .rk i{font-style:normal;width:26px;font-weight:800;color:var(--ink);}
  .rk b{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rk u{text-decoration:none;font-weight:800;color:var(--ink);}
  #splats{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;}
  .splat{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 38% 34%, rgba(255,255,255,.98), rgba(214,238,247,.85) 55%, rgba(214,238,247,0) 72%);}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="gl"></div>
  <div id="glow"></div>
  <div id="fallzone"></div>
  <div id="splats"></div>
  <div id="flash"></div>

  <div id="topbar">
    <div class="pill" id="score"><span class="lbl">받은 문장</span><b id="scoreNum">0</b></div>
    <div class="pill" id="clock"><b id="clockNum">0:00</b></div>
    <div id="spacer"></div>
    <button class="pill" id="mute" type="button">🔊</button>
    <button class="pill" id="reset" type="button">처음부터</button>
  </div>
  <div id="combo"><i>COMBO</i><span id="comboNum">0</span><em id="cbar"><b id="cbarFill"></b></em></div>

  <div id="bottom">
    <div id="gauge"><div id="gfill"></div></div>
    <div id="row">
      <input id="input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="떨어지는 문장을 그대로 치세요">
      <button id="clear" type="button">지우기</button>
    </div>
  </div>
</div>
</div>

<div class="veil on" id="startV"><div class="card">
  <h2>고래</h2>
  <div class="modes">
    <button class="btn" id="mPhone" type="button">폰</button>
    <button class="btn" id="mKey" type="button">키보드</button>
  </div>
  <div class="btns"><button class="btn" id="startRank" type="button">순위</button></div>
</div></div>

<div class="veil" id="overV"><div class="card">
  <div class="big" id="ovTime">0<small>초</small></div>
  <div class="sub" id="ovSub"></div>
  <input id="wname" type="text" maxlength="8" placeholder="이름" autocomplete="off">
  <div class="modes">
    <button class="btn" id="oPhone" type="button">폰</button>
    <button class="btn" id="oKey" type="button">키보드</button>
  </div>
  <div class="btns">
    <button class="btn hot" id="ovAgain" type="button">다시</button>
    <button class="btn" id="ovRank" type="button">순위</button>
  </div>
</div></div>

<div class="veil" id="rankV"><div class="card">
  <h2>순위</h2>
  <div class="modes">
    <button class="btn" id="rPhone" type="button">폰</button>
    <button class="btn" id="rKey" type="button">키보드</button>
  </div>
  <div id="rankList" style="margin-top:12px"></div>
  <div class="btns"><button class="btn" id="rankClose" type="button">닫기</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

   COMBO_GAIN — 콤보 한 칸마다 문장 한 장이 채우는 게이지가 이만큼 늘어납니다.
                빨리 치는 사람이 빨리 끝내는 건 전부 이 값에서 나옵니다. */
var COMBO_TIGHTEN = 0.80;   // 콤보 20에서 창이 80% 로 좁아집니다
var COMBO_GAIN = 0.085;     // 콤보 20이면 한 장이 2.7배를 채웁니다
var COMBO_GAIN_CAP = 20;

/* 판 길이를 정하는 값 둘.
   GAIN — 문장 하나를 받을 때마다 게이지가 바로 오르는 양. 이게 판 길이를 정합니다.
          올리면 짧아지고 내리면 길어집니다. 폰 6.0 이면 열일곱 장에 끝납니다.
   RATE — 고래가 춤추는 동안 추가로 차는 양. 콤보가 높아 큰 기술이 나오면 더 찹니다.
   회복은 개념만 남겨둔 값입니다. 게이지 50 에서 손을 놓으면 비우는 데 40분 걸립니다.
   아무것도 안 치면 0 에서 안 움직이므로 고래는 죽지 않습니다. */
var GAUGE_DECAY = 0.02;


/* ════════ 오디오 ════════ */
var AC=null, master=null, noiseBuf=null, engine=null, muted=false;
function audioInit(){
  if (AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
  var len = AC.sampleRate*2;
  noiseBuf = AC.createBuffer(1,len,AC.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  buildVerb();
  var s = AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=0.4;
  var g = AC.createGain(); g.gain.value=0.055;
  s.connect(lp); lp.connect(g); g.connect(master); s.start();
}

/* 지연을 몇 개 엮은 잔향. 소리가 물 위에 퍼지는 느낌을 냅니다. */
var verbIn=null;
function buildVerb(){
  verbIn = AC.createGain(); verbIn.gain.value = 1;
  var wet = AC.createGain(); wet.gain.value = 0.5;
  var damp = AC.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value = 2600;
  var times = [0.041, 0.067, 0.094, 0.131];
  var fb    = [0.72, 0.68, 0.63, 0.58];
  for (var i=0;i<times.length;i++){
    var d = AC.createDelay(1.0); d.delayTime.value = times[i];
    var f = AC.createGain(); f.gain.value = fb[i];
    var lp2 = AC.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value = 2100;
    verbIn.connect(d); d.connect(lp2); lp2.connect(f); f.connect(d);   // 되먹임
    d.connect(damp);
  }
  damp.connect(wet); wet.connect(master);
}
function sendVerb(node, amt){
  if(!verbIn) return;
  var g = AC.createGain(); g.gain.value = amt;
  node.connect(g); g.connect(verbIn);
}
function unlock(){ audioInit(); if (AC && AC.state==='suspended') AC.resume(); }
document.addEventListener('pointerdown', unlock);

/* 물이 튀는 소리는 한 겹으로는 안 납니다. 세 겹으로 쌓습니다.
   ① 덩어리가 수면을 때리는 저음  ② 흩어지는 물보라  ③ 뒤따르는 물방울 */
function sfxSplash(power,bright){
  if(!AC||muted) return;
  power=Math.max(0.25,Math.min(3.6,power));
  var t=AC.currentTime;

  var out=AC.createGain(); out.gain.value=1;
  out.connect(master); sendVerb(out, 0.3+0.12*power);

  // ① 때리는 저음 — 짧고 묵직하게
  var d1=0.13+power*0.10;
  var s1=AC.createBufferSource(); s1.buffer=noiseBuf; s1.loop=true;
  s1.playbackRate.value=0.7;
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=1.1;
  lp.frequency.setValueAtTime(900*Math.min(1.5,power),t);
  lp.frequency.exponentialRampToValueAtTime(110,t+d1);
  var g1=AC.createGain();
  g1.gain.setValueAtTime(0.0001,t);
  g1.gain.exponentialRampToValueAtTime(Math.min(0.5,0.24*power),t+0.008);
  g1.gain.exponentialRampToValueAtTime(0.0001,t+d1);
  s1.connect(lp); lp.connect(g1); g1.connect(out);
  s1.start(t); s1.stop(t+d1+0.05);

  // 수면이 눌리는 저역 한 방
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(150*Math.min(1.4,power),t);
  o.frequency.exponentialRampToValueAtTime(46,t+d1*1.4);
  var og=AC.createGain();
  og.gain.setValueAtTime(0.0001,t);
  og.gain.exponentialRampToValueAtTime(0.10*power,t+0.012);
  og.gain.exponentialRampToValueAtTime(0.0001,t+d1*1.5);
  o.connect(og); og.connect(out);
  o.start(t); o.stop(t+d1*1.6);

  // ② 흩어지는 물보라 — 길게 쉬이익
  var d2=0.45+power*0.55;
  var s2=AC.createBufferSource(); s2.buffer=noiseBuf; s2.loop=true;
  var hp=AC.createBiquadFilter(); hp.type='highpass';
  hp.frequency.setValueAtTime((bright?2600:1500),t);
  hp.frequency.exponentialRampToValueAtTime(bright?5200:3400,t+d2);
  var g2=AC.createGain();
  g2.gain.setValueAtTime(0.0001,t);
  g2.gain.exponentialRampToValueAtTime(Math.min(0.28,0.11*power),t+0.03);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+d2);
  s2.connect(hp); hp.connect(g2); g2.connect(out);
  s2.start(t); s2.stop(t+d2+0.06);

  // ③ 물방울 — 짧은 사인이 위로 튑니다. 이게 있어야 물 소리로 들립니다.
  var drops=Math.round(3+power*4);
  for(var i=0;i<drops;i++){
    var at=t+0.05+Math.random()*(0.1+power*0.42);
    var f0=520+Math.random()*900;
    var b=AC.createOscillator(); b.type='sine';
    b.frequency.setValueAtTime(f0,at);
    b.frequency.exponentialRampToValueAtTime(f0*(1.7+Math.random()),at+0.055);
    var bg=AC.createGain();
    bg.gain.setValueAtTime(0.0001,at);
    bg.gain.exponentialRampToValueAtTime(0.028+Math.random()*0.022,at+0.005);
    bg.gain.exponentialRampToValueAtTime(0.0001,at+0.075);
    b.connect(bg); bg.connect(out);
    b.start(at); b.stop(at+0.1);
  }
}
/* 고래 울음.
   삐 소리가 나던 건 배음이 없어서였습니다. 톱니파를 성대 삼고,
   포먼트 필터 두 개로 목통을 만들고, 숨소리를 섞고, 잔향으로 바다에 놓습니다. */
function sfxCall(base,dur,glide,vol){
  if(!AC||muted) return;
  var t=AC.currentTime;
  vol = vol||0.30;
  var end = Math.max(40, base*glide);

  var out=AC.createGain();
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(vol, t+Math.min(0.22,dur*0.28));   // 천천히 벌어지고
  out.gain.setValueAtTime(vol, t+dur*0.55);
  out.gain.exponentialRampToValueAtTime(0.0001, t+dur*1.35);               // 길게 사라집니다
  out.connect(master); sendVerb(out, 0.55);

  // 목통 — 두 개의 공명점
  var f1=AC.createBiquadFilter(); f1.type='bandpass'; f1.Q.value=3.4;
  var f2=AC.createBiquadFilter(); f2.type='bandpass'; f2.Q.value=5.5;
  f1.frequency.setValueAtTime(base*2.1,t);
  f1.frequency.exponentialRampToValueAtTime(end*1.7,t+dur);
  f2.frequency.setValueAtTime(base*4.3,t);
  f2.frequency.exponentialRampToValueAtTime(end*3.2,t+dur);
  var mix=AC.createGain(); mix.gain.value=0.55;
  f1.connect(out); f2.connect(mix); mix.connect(out);

  // 성대 — 톱니 두 개를 살짝 어긋나게 겹칩니다
  var det=[0,-7,9];
  for(var i=0;i<det.length;i++){
    var o=AC.createOscillator();
    o.type = i===0 ? 'sawtooth' : 'triangle';
    o.detune.value=det[i];
    o.frequency.setValueAtTime(base,t);
    // 처음에 살짝 올라갔다가 내려옵니다. 곧게 미끄러지면 기계 소리가 납니다.
    o.frequency.exponentialRampToValueAtTime(base*1.09, t+dur*0.18);
    o.frequency.exponentialRampToValueAtTime(end, t+dur);
    var og=AC.createGain(); og.gain.value = i===0 ? 0.5 : 0.22;
    o.connect(og); og.connect(f1); og.connect(f2);
    o.start(t); o.stop(t+dur*1.4);

    if(i===0){
      // 떨림 — 뒤로 갈수록 깊어집니다
      var lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=4.6;
      var lg=AC.createGain();
      lg.gain.setValueAtTime(base*0.006,t);
      lg.gain.linearRampToValueAtTime(base*0.055,t+dur);
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t); lfo.stop(t+dur*1.4);
    }
  }

  // 숨 — 이게 있어야 살아 있는 것처럼 들립니다
  var nz=AC.createBufferSource(); nz.buffer=noiseBuf; nz.loop=true;
  var nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.Q.value=0.9;
  nf.frequency.setValueAtTime(base*3.2,t);
  nf.frequency.exponentialRampToValueAtTime(end*2.4,t+dur);
  var ng=AC.createGain();
  ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(vol*0.32,t+0.14);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+dur*1.1);
  nz.connect(nf); nf.connect(ng); ng.connect(out);
  nz.start(t); nz.stop(t+dur*1.4);
}
/* 문장을 받을 때마다 한 음씩 올라갑니다.
   반음으로 올리면 금방 이상해지므로 5음계로 올립니다. */
var PENTA=[0,2,4,7,9];
function pentaHz(n){
  var i=Math.min(n,29);
  return 392*Math.pow(2,(PENTA[i%5]+Math.floor(i/5)*12)/12);
}
function sfxBlip(n){
  if(!AC||muted) return;
  var t=AC.currentTime, f=pentaHz(n);
  // 3도·5도를 얇게 얹어 화음으로 울립니다
  var stack=[[1,0.10,'triangle'],[1.26,0.045,'sine'],[1.5,0.05,'sine'],[2,0.035,'triangle']];
  for(var i=0;i<stack.length;i++){
    var o=AC.createOscillator(); o.type=stack[i][2];
    o.frequency.setValueAtTime(f*stack[i][0],t);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(stack[i][1],t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
    o.connect(g); g.connect(master); sendVerb(g, 0.28);
    o.start(t); o.stop(t+0.4);
  }
  // 맨 앞의 반짝이는 잡음
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5200;
  var ng=AC.createGain();
  ng.gain.setValueAtTime(0.055,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  s.connect(hp); hp.connect(ng); ng.connect(master); s.start(t); s.stop(t+0.16);
}
/* 헥헥. 들이쉬고 내쉬는 두 번. 지칠수록 거칠고 높아집니다. */
function sfxPant(e){
  if(!AC||muted) return;
  var t=AC.currentTime;
  function breath(at,dur,f0,f1,vol){
    var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
    bp.frequency.setValueAtTime(f0,at);
    bp.frequency.exponentialRampToValueAtTime(f1,at+dur);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(vol,at+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    s.connect(bp); bp.connect(g); g.connect(master); sendVerb(g, 0.4);
    s.start(at); s.stop(at+dur+0.05);
  }
  var v=0.05+e*0.09;
  breath(t,        0.20+e*0.05, 420, 1500, v);        // 들이쉬고
  breath(t+0.26,   0.26+e*0.06, 1300, 380, v*0.9);    // 내쉬고
  // 목에서 걸리는 소리
  var o=AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(96+e*40,t+0.26);
  o.frequency.exponentialRampToValueAtTime(62,t+0.5);
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
  var g2=AC.createGain();
  g2.gain.setValueAtTime(0.0001,t+0.26);
  g2.gain.exponentialRampToValueAtTime(0.035*e,t+0.31);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.52);
  o.connect(lp); lp.connect(g2); g2.connect(master);
  o.start(t+0.26); o.stop(t+0.56);
}

/* 물이 튀는 순간의 잔반짝임 */
function sfxSpark(power){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.6;
  bp.frequency.setValueAtTime(6800,t);
  bp.frequency.exponentialRampToValueAtTime(2600,t+0.3);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.05*Math.min(1.6,power),t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.4);
}
/* 놓치는 문장이 이제 아주 많습니다. 그때마다 소리가 나면 판이 시끄럽고,
   놓친 걸 벌주는 것처럼 들립니다. 작게 깔고, 겹치면 건너뜁니다. */
var lastMiss=0;
function sfxMiss(){
  if(!AC||muted) return;
  var t=AC.currentTime;
  if(t-lastMiss<0.55) return;
  lastMiss=t;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(560,t);
  lp.frequency.exponentialRampToValueAtTime(130,t+0.4);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.045,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
  s.connect(lp); lp.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.5);
}

/* 타격의 몸통. 물 소리만으로는 배로 안 옵니다.
   저음이 훅 떨어지는 한 방과 앞머리의 딱 소리를 같이 냅니다. */
var shaperCurve=null;
function driveCurve(){
  if(shaperCurve) return shaperCurve;
  var n=1024; shaperCurve=new Float32Array(n);
  for(var i=0;i<n;i++){
    var x=i/(n-1)*2-1;
    shaperCurve[i]=Math.tanh(x*2.6);
  }
  return shaperCurve;
}
function sfxKick(power){
  if(!AC||muted) return;
  power=Math.max(0.3,Math.min(3.4,power));
  var t=AC.currentTime;

  var ws=AC.createWaveShaper(); ws.curve=driveCurve(); ws.oversample='2x';
  var out=AC.createGain(); out.gain.value=1;
  ws.connect(out); out.connect(master); sendVerb(out,0.12);

  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(210*Math.min(1.5,power),t);
  o.frequency.exponentialRampToValueAtTime(36,t+0.15+power*0.03);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.62,0.22*power),t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.30+power*0.05);
  o.connect(g); g.connect(ws);
  o.start(t); o.stop(t+0.42+power*0.06);

  // 앞머리 — 이게 있어야 '맞았다'로 들립니다
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
  bp.frequency.setValueAtTime(1800,t);
  bp.frequency.exponentialRampToValueAtTime(420,t+0.06);
  var ng=AC.createGain();
  ng.gain.setValueAtTime(Math.min(0.24,0.09*power),t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  s.connect(bp); bp.connect(ng); ng.connect(ws);
  s.start(t); s.stop(t+0.1);
}
/* 큰 기술에만 얹는 심벌. 위쪽이 뻥 뚫려야 시원합니다. */
function sfxCrash(power){
  if(!AC||muted) return;
  var t=AC.currentTime, d=0.7+power*0.35;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  s.playbackRate.value=1.4;
  var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3400;
  var pk=AC.createBiquadFilter(); pk.type='peaking';
  pk.frequency.value=8200; pk.Q.value=0.7; pk.gain.value=7;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.13,0.045*power),t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(hp); hp.connect(pk); pk.connect(g); g.connect(master); sendVerb(g,0.45);
  s.start(t); s.stop(t+d+0.05);
}
/* 콤보 다섯 칸마다 한 번. 화음이 통째로 올라갑니다. */
function sfxFanfare(step){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var root=392*Math.pow(2,Math.min(step,6)*2/12);
  var mul=[1,1.26,1.5,2,2.52];
  for(var i=0;i<mul.length;i++){
    var at=t+i*0.035;
    var o=AC.createOscillator(); o.type=i<2?'triangle':'sine';
    o.frequency.setValueAtTime(root*mul[i],at);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.075/(1+i*0.35),at+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.85);
    o.connect(g); g.connect(master); sendVerb(g,0.4);
    o.start(at); o.stop(at+0.95);
  }
}
/* 콤보가 시간에 밀려 풀릴 때. 조용히 한 계단 내려갑니다. */
function sfxComboDrop(){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(360,t);
  o.frequency.exponentialRampToValueAtTime(190,t+0.26);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.05,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  o.connect(g); g.connect(master); sendVerb(g,0.25);
  o.start(t); o.stop(t+0.34);
}
function sfxThud(){
  if(!AC||muted) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(900,t);
  lp.frequency.exponentialRampToValueAtTime(90,t+0.22);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.5,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  s.connect(lp); lp.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.32);
}
function startEngine(){
  if(!AC||engine) return;
  var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=58;
  var lfo=AC.createOscillator(); lfo.frequency.value=7.5;
  var lg=AC.createGain(); lg.gain.value=5;
  lfo.connect(lg); lg.connect(o.frequency);
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=240;
  var g=AC.createGain(); g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(0.13,AC.currentTime+1.6);

var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var TENSE={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ','ㅄ':'ㅂㅅ','ㄳ':'ㄱㅅ'};
function soften(j){ return TENSE[j]||j; }
function jnorm(text){
  var src=String(text).toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g,''), out='';
  for(var i=0;i<src.length;i++){
    var c=src.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3){
      var v=c-0xAC00, cho=CHO[Math.floor(v/588)], ju=JUNG[Math.floor((v%588)/28)], jo=JONG[v%28];
      if(cho!=='ㅇ') out+=soften(cho);
      out+=ju; if(jo) out+=soften(jo);
    } else out+=soften(src[i]);
  }
  return out.replace(/(.)\1+/g,'$1');
}
function chosung(text){
  var src=String(text).toLowerCase().replace(/[^가-힣ㄱ-ㅎ]/g,''), out='';
  for(var i=0;i<src.length;i++){
    var c=src.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3) out+=soften(CHO[Math.floor((c-0xAC00)/588)]);
    else out+=soften(src[i]);
  }
  return out.replace(/(.)\1+/g,'$1');
}
function looseRatio(t){
  var s=String(t).replace(/\s+/g,'');
  if(!s.length) return 0;
  var m=s.match(/[ㄱ-ㅎㅏ-ㅣ]/g);
  return m?m.length/s.length:0;
}
var BAD_WORDS=['시발','씨발','시팔','씹','좆','병신','븅신','새끼','개새','지랄','꺼져','닥쳐',
  '등신','멍청','바보','또라이','한심','쓰레기','역겨','더러워','징그러',
  '죽어','죽여','뒤져','뒈져','자살','없어져','사라져','못생','뚱뚱','노잼','짜증','최악'];
var BAD=BAD_WORDS.map(function(w){return {raw:w,key:jnorm(w)};});
var BAD_CHO=['ㅅㅂ','ㅂㅅ','ㅈㄹ','ㄲㅈ','ㄷㅊ','ㄱㅅㄲ'].map(function(w){return {raw:w,key:chosung(w)};});
function detectBad(t){
  var n=jnorm(t);
  for(var i=0;i<BAD.length;i++) if(BAD[i].key&&n.indexOf(BAD[i].key)!==-1) return BAD[i].raw;
  // 초성 약자는 정말로 낱자모를 치고 있을 때만 본다 (조합 중인 글자로는 안 열림)
  if(looseRatio(t)>=0.4){
    var c=chosung(t);
    for(var j=0;j<BAD_CHO.length;j++) if(BAD_CHO[j].key&&c.indexOf(BAD_CHO[j].key)!==-1) return BAD_CHO[j].raw;
  }
  return null;
}

/* 파도 미리 계산표.
   파도는 sin(정점마다 고정된 값 ± 시간) 세 개의 합입니다.
   덧셈정리로 풀면 정점 쪽 sin·cos 은 시간과 무관해 한 번만 구해두면 되고,
   매 프레임에는 시간 쪽 sin·cos 여섯 개만 구하면 됩니다.
   같은 식을 다르게 묶은 것뿐이라 물결 모양은 이전과 동일합니다. */
var W1S,W1C,W2S,W2C,W3S,W3C;
function buildWaveTables(){
  var n=waterBase.length/3;
  W1S=new Float64Array(n); W1C=new Float64Array(n);
  W2S=new Float64Array(n); W2C=new Float64Array(n);
  W3S=new Float64Array(n); W3C=new Float64Array(n);
  for(var i=0;i<n;i++){
    var bx=waterBase[i*3], bz=waterBase[i*3+2];
    var dd=Math.sqrt(bx*bx+bz*bz);
    var a=bx*0.16, b=bz*0.21, c=dd*0.30;
    var fall=0.26*(1-Math.min(1,dd/45));
    W1S[i]=Math.sin(a)*0.34; W1C[i]=Math.cos(a)*0.34;
    W2S[i]=Math.sin(b)*0.30; W2C[i]=Math.cos(b)*0.30;
    W3S[i]=Math.sin(c)*fall; W3C[i]=Math.cos(c)*fall;
  }
}

/* 견출지에 매직으로 쓴 글씨. 반듯하면 인쇄물로 보여서 조금씩 비뚤게 씁니다. */
/* 머리 표면 위의 한 점. 몸통을 만들 때 쓴 것과 같은 식이라 정확히 곡면에 붙습니다.
   a 는 좌우, b 는 아래로 내려간 각도, off 는 표면에서 띄우는 거리입니다. */
function headSurf(a,b,off){
  var dx=Math.sin(a)*Math.cos(b), dy=-Math.sin(b), dz=-Math.cos(a)*Math.cos(b);
  var t=(dz+1)/2, r;
  if(t<0.16) r=0.70+0.30*(t/0.16);
  else r=1-Math.pow((t-0.16)/0.84,1.9)*0.94;
  var px=dx*r*0.62, py=dy*r*0.54, pz=dz*1.85;
  var nx=px/(0.62*0.62), ny=py/(0.54*0.54), nz=pz/(1.85*1.85);
  var nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
  return [px+nx/nl*off, py+ny/nl*off, pz+nz/nl*off];
}

/* 입 모양. 가운데가 가장 크게 벌어지고 입꼬리로 갈수록 닫힙니다. */
function mouthPatch(off,W,H,mid){
  var NA=30,NB=10,pos=[],idx=[],i,j;
  for(i=0;i<=NA;i++){
    var u=-1+2*i/NA, a=u*W;
    var half=H*Math.sqrt(Math.max(0,1-u*u));
    var bm=mid+0.17*u*u;                         // 입꼬리가 조금 내려갑니다
    for(j=0;j<=NB;j++){
      var v=-1+2*j/NB;
      var q=headSurf(a,bm+v*half,off);
      pos.push(q[0],q[1],q[2]);
    }
  }
  for(i=0;i<NA;i++) for(j=0;j<NB;j++){
    var A=i*(NB+1)+j, B=A+NB+1;
    idx.push(A,B,A+1, A+1,B,B+1);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* 물보라 위에 얹는 반짝임. 가산 합성이라 햇빛 튀는 것처럼 보입니다. */
var SPK_MAX=460, sparkle=null, spkData=[];
function buildSparkle(){
  var cv=document.createElement('canvas'); cv.width=cv.height=64;
  var cx=cv.getContext('2d');
  var gr=cx.createRadialGradient(32,32,0,32,32,30);

  sparkle=new THREE.Points(geo,new THREE.PointsMaterial({
    size:3.2,color:0xfff0c8,map:new THREE.CanvasTexture(cv),transparent:true,

/* 빈 슬롯을 0번부터 다시 훑지 않고, 지난번에 멈춘 자리에서 이어 찾습니다.
   만들어지는 개수와 값은 같고 담기는 칸 번호만 달라집니다.
   물보라는 전부 같은 색이라, 반짝임은 가산 합성이라 겹치는 순서가 결과를 바꾸지 않습니다. */
var splashCur=0, spkCur=0;
function spawnSparkle(n,ox,oy,oz,power,spread){
  spread=spread||3; var made=0, scan=0;
  while(made<n && scan<SPK_MAX){
    var idx=spkCur; spkCur=(spkCur+1)%SPK_MAX; scan++;
    var p=spkData[idx]; if(p.live) continue;
    var a=Math.random()*Math.PI*2, r=Math.random()*spread;
    p.live=true; p.life=0; p.max=0.5+Math.random()*0.9;
    p.x=ox+Math.cos(a)*r; p.y=oy+Math.random()*1.6; p.z=oz+Math.sin(a)*r;
    p.vx=Math.cos(a)*(2+Math.random()*7)*power;
    p.vy=(7+Math.random()*13)*power;
    p.vz=Math.sin(a)*(2+Math.random()*7)*power;
    made++;
  }
}

function buildRings(){
  var rg=new THREE.RingGeometry(1,1.17,56); rg.rotateX(-Math.PI/2);

function ripple(x,z,grow){

    if(rings[i].live) continue;
    var r=rings[i]; r.live=true; r.t=0; r.max=1.4; r.grow=grow;

function spawnSplash(n,ox,oz,power,spread){
  spread=spread||2.6; var made=0, scan=0;
  while(made<n && scan<SPLASH_MAX){
    var idx=splashCur; splashCur=(splashCur+1)%SPLASH_MAX; scan++;
    var p=splashData[idx]; if(p.live) continue;
    var a=Math.random()*Math.PI*2,r=Math.random()*spread;
    p.live=true;p.life=0;p.max=1.1+Math.random()*1.6;
    p.x=ox+Math.cos(a)*r;p.y=0.2+Math.random()*0.6;p.z=oz+Math.sin(a)*r;
    p.vx=Math.cos(a)*(2.6+Math.random()*8)*power;
    p.vy=(11+Math.random()*18)*power;
    p.vz=Math.sin(a)*(2.6+Math.random()*8)*power;
    made++;
  }
}
function bigHit(x,z,power,spread){
  power*=(1-0.60*EXH);
  power*=(1+0.55*FEVER);            // 콤보가 붙을수록 같은 기술도 크게 터집니다
  power=Math.min(3.4,power);        // 물보라 속도가 여기 묶여 있어 상한이 필요합니다
  var sp=(spread||4)*(1+0.25*FEVER);
  spawnSplash(Math.round(255*power),x,z,power,sp);
  spawnSparkle(Math.round(64*power),x,0.4,z,power*0.95,sp*0.8);
  ripple(x,z,power*11);
  ripple(x,z,power*6.5);
  if(power>1.6) ripple(x,z,power*16);
  sfxSplash(power,power>1.5);
  sfxSpark(power);
  sfxKick(power);
  if(power>=1.7) sfxCrash(power);
  shake=Math.max(shake,Math.min(1.15,power*0.58));
  squash=Math.max(squash,Math.min(1,power*0.52));
  hitstop=Math.max(hitstop,Math.min(0.085,0.012+power*0.022));
  flash(Math.min(0.42,0.07+power*0.10));
}

/* 폰 키패드는 화면을 줄이지 않고 위를 덮습니다.
   보통은 브라우저가 '보이는 영역' 높이를 알려주지만,
   인스타·카톡 같은 앱 안의 브라우저는 그걸 안 알려주는 경우가 있습니다.
   그럴 때는 키패드 높이를 짐작해서 대신 씁니다. */
var fullH = window.innerHeight;   // 키패드 없을 때의 높이
var kbGuess = 0;                  // 알려주지 않을 때 쓰는 추정 높이
  
var isTouch = (('ontouchstart' in window) || navigator.maxTouchPoints>0)
              && window.matchMedia('(pointer:coarse)').matches;

function viewH(){
  var vv=window.visualViewport;
  return vv ? vv.height : window.innerHeight;
}
function fitViewport(){
  var h=viewH();
  if(kbGuess) h=Math.min(h, fullH-kbGuess);
  h=Math.max(240, Math.round(h));
  document.documentElement.style.setProperty('--vh', h+'px');
  var vv=window.visualViewport;
  if((vv && vv.offsetTop) || window.pageYOffset) window.scrollTo(0,0);
  onResize();
}
/* 입력창을 누른 뒤에도 높이가 그대로면, 이 브라우저는 안 알려주는 것입니다.
   그때만 화면의 44% 를 키패드로 치고 판을 줄입니다. */
function checkKeyboard(){
  if(!isTouch || MODE==='key') return;
  if(document.activeElement!==el.input){ 
    if(kbGuess){ kbGuess=0; fitViewport(); }
    return;
  }
 
  
  if(fullH - viewH() < 110){
    var guess=Math.round(fullH*0.44);
    if(guess!==kbGuess){ kbGuess=guess; fitViewport(); }
  } else if(kbGuess){
    kbGuess=0; fitViewport();
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){
    if(document.activeElement!==el.input) fullH=Math.max(fullH, viewH());
    kbGuess=0; fitViewport();
  });
  window.visualViewport.addEventListener('scroll', fitViewport);
}
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ kbGuess=0; fullH=window.innerHeight; fitViewport(); },350);
});

function onResize(){
  var w=host.clientWidth,h=host.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  layoutFallzone();
}
window.addEventListener('resize',function(){
  if(document.activeElement!==el.input) fullH=Math.max(fullH, window.innerHeight);
  fitViewport();
});

function kf(u,pts){
  for(var i=0;i<pts.length-1;i++){
    if(u<=pts[i+1][0]){
      var a=pts[i],b=pts[i+1];
      var k=(u-a[0])/((b[0]-a[0])||1); k=k*k*(3-2*k);
      return a[1]+(b[1]-a[1])*k;
    }
  }
  return pts[pts.length-1][1];
}

function pickMoves(combo){
  // 다 지치면 춤이 안 나옵니다
  if(EXH>=0.92) return ['TWITCH'];
  if(EXH>=0.72) return combo>=5 ? ['SLAP','TWITCH'] : ['TWITCH'];
  if(EXH>=0.45){
    if(combo<=2) return ['SLAP'];
    if(combo<=5) return ['ROLL','SLAP'];
    return ['STAND','THRASH','ROLL'];
  }
  if(combo<=1) return ['SLAP'];
  if(combo===2) return ['STAND'];
  if(combo===3) return ['THRASH','ROLL'];
  if(combo===4) return ['BREACH'];
  if(combo<=6)  return ['SPINJUMP','THRASH'];
  if(combo<=8)  return ['BREACH','SLAPFEST','PORPOISE'];
  if(combo<=11) return ['CANNON','CORKSCREW','THRASH'];
  if(combo<=15) return ['CANNON','SPINJUMP','SLAPFEST','CORKSCREW'];
  // 여기서부터는 쉬지 않습니다
  return ['CANNON','CORKSCREW','SLAPFEST','BREACH','SPINJUMP','CANNON'];
}

/* 죽음 연출·습격에 걸린 예약 동작.
   처음부터를 누르면 여기 걸린 것들을 전부 취소합니다.
   안 그러면 새 판 위로 결과창이 뒤늦게 덮입니다. */
var timers=[];
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
function clearTimers(){
  for(var i=0;i<timers.length;i++) clearTimeout(timers[i]);
  timers.length=0;
}

var WATERLINE=0;
var ZONE_TOP=56;
function layoutFallzone(){
  var h=el.stage.clientHeight;
  // 키패드가 올라와 판이 짧아지면 수면선을 끌어올려 글자 구간을 지켜냅니다.
  // 그 순간 필요한 건 고래가 아니라 읽을 자리입니다.
  var ratio = h<420 ? 0.76 : (h<560 ? 0.68 : 0.60);
  WATERLINE=Math.max(120, Math.round(h*ratio)-ZONE_TOP);
  el.zone.style.height=(WATERLINE+70)+'px';
}
function nsp(s){ return String(s).replace(/\s+/g,''); }

/* 폰에서 한글을 치면 ㄴ → 너 → 넌 순서로 조합됩니다.
   그동안 접두사 비교가 깨져서 잠금이 풀리므로, 마지막 글자만 자모로 풀어서 비교합니다. */
var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
var JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ',
          'ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function jamo(ch){
  var c=ch.charCodeAt(0)-0xAC00;
  if(c<0||c>11171) return ch;
  return CHO[Math.floor(c/588)] + JUNG[Math.floor((c%588)/28)] + JONG[c%28];
}
function hpre(target, v){
  if(!v.length) return false;
  if(target.indexOf(v)===0) return true;
  var head=v.slice(0,-1);
  if(target.indexOf(head)!==0) return false;
  var tc=target[head.length];
  if(!tc) return false;
  return jamo(tc).indexOf(jamo(v[v.length-1]))===0;
}

var SORTED=null, recent=[], falls=[], deadPile=[], S;
var label=null, LBL_HOME=null, labelOff=0;
// 떨어진 라벨이 물 위에 자리잡는 지점
var LBL_P=new THREE.Vector3(-0.10,0.30,-3.72);
// 수면에 완전히 눕히면 글씨가 눌려 보입니다. 카메라 쪽으로 조금 세웁니다.
var LBL_Q=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2-0.62,0.44,0,'XYZ'));
function ease01(x){ x=x<0?0:(x>1?1:x); return x*x*(3-2*x); }

function paint(){
  el.gfill.style.width=S.gauge.toFixed(1)+'%';
  el.gfill.style.filter='saturate('+(1-EXH*0.75).toFixed(2)+') brightness('+(1-EXH*0.28).toFixed(2)+')';
  el.gauge.classList.toggle('near', S.gauge>=88 && !S.dead);
  el.scoreNum.textContent=S.score;
  var cs=Math.floor(S.run);
  var cstr=Math.floor(cs/60)+':'+('0'+(cs%60)).slice(-2);
  if(cstr!==el._clock){ el._clock=cstr; el.clockNum.textContent=cstr; }
  if(S.combo>=2){
    el.comboNum.textContent=S.combo;
    el.combo.style.opacity='1';
    el.combo.style.fontSize=Math.min(62,26+S.combo*3.4)+'px';
    var left=S.comboMax?Math.max(0,S.comboT/S.comboMax):0;
    el.cbarFill.style.width=(left*100).toFixed(1)+'%';
    el.combo.classList.toggle('low', left<0.30);
  } else {
    el.combo.style.opacity='0';
    el.combo.classList.remove('low');
  }
}

function progress(){ return Math.min(1, S.run/D.RAMP); }

// 짧은 문장부터 시작해서 진행할수록 긴 문장이 섞인다
function drawLine(prog){
  if(!SORTED) SORTED=LINES.slice().sort(function(a,b){ return nsp(a).length-nsp(b).length; });
  var n=SORTED.length;
  // 초반 풀이 좁으면 같은 문장이 금방 돌아옵니다. 처음부터 절반 가까이 엽니다.
  var maxIdx=Math.max(22, Math.round(n*(0.46+0.54*prog)));
  if(maxIdx>n) maxIdx=n;
  var pick, tries=0;
  do{
    pick=SORTED[Math.floor(Math.random()*maxIdx)];
    tries++;
  } while(recent.indexOf(pick)!==-1 && tries<40);
  recent.push(pick);
  if(recent.length>Math.min(26,maxIdx-4)) recent.shift();
  return pick;
}

function spawnLine(){
  var prog=progress();
  var text=drawLine(prog);
  var chars=nsp(text).length;

  var d=document.createElement('div');
  d.className='ln'+(chars>=18?' long':'');
  d.textContent=text;
  d.style.top='-60px';
  d.style.left='50%';
  d.style.maxWidth='86%';
  d.style.whiteSpace = chars>=15 ? 'normal' : 'nowrap';
  el.zone.appendChild(d);

  // 실제 너비를 재서 화면 밖으로 안 나가는 위치에 놓는다
  var zw=el.zone.clientWidth||360;
  var half=(d.offsetWidth/2/zw)*100;
  var lo=half+2, hi=98-half;
  if(hi<lo){ lo=hi=50; }
  d.style.left=(lo+Math.random()*(hi-lo)).toFixed(2)+'%';

  var dur=(D.FALL_BASE + chars*D.FALL_PER_CHAR) * (1-(1-D.FALL_TIGHTEN)*prog);
  falls.push({el:d, text:text, norm:nsp(text), y:-60, dur:dur, p:0, done:false});
}

function maxOnScreen(){
  var m=Math.round(D.MAX_ON_EARLY+(D.MAX_ON_LATE-D.MAX_ON_EARLY)*progress());
  // 키패드가 올라와 낙하 구간이 짧아지면 겹쳐서 안 읽힙니다.
  // 글상자를 줄인 만큼 한 칸도 줄였습니다.
  var room=Math.max(3, Math.floor(WATERLINE/44));
  return Math.min(m, room);
}

function updateMatch(){
  var v=nsp(el.input.value);
  var target=null, exact=null;
  if(v.length){
    for(var i=0;i<falls.length;i++){
      var f=falls[i];
      if(f.done) continue;
      // 다 친 문장이 있으면 그게 먼저다.
      // 급한 것부터 잠그기만 하면, 같은 말로 시작하는 긴 문장이 아래에 있을 때
      // 짧은 문장을 끝까지 쳐도 완성이 안 된다.
      if(f.norm===v){
        if(!exact || f.y>exact.y) exact=f;
      }
      if(hpre(f.norm, v)){
        if(!target || f.y>target.y) target=f;   // 더 급한 것 우선
      }
    }
  }
  if(exact) target=exact;
  el.input.classList.toggle('nomatch', v.length>0 && !target);

  for(var j=0;j<falls.length;j++){
    var g=falls[j];
    if(g.done) continue;
    if(g===target){
      g.el.classList.add('lock');
      var n=0,cut=0;
      while(cut<g.text.length && n<v.length){
        if(g.text[cut]!==' ') n++;
        cut++;
      }
      g.el.innerHTML='<span class="done"></span><span></span>';
      g.el.firstChild.textContent=g.text.slice(0,cut);
      g.el.lastChild.textContent=g.text.slice(cut);
    } else if(g.el.classList.contains('lock')){
      g.el.classList.remove('lock');
      g.el.textContent=g.text;
    }
  }

  if(target && v===target.norm) complete(target);
  return target;
}

/* 완성한 문장은 껍데기가 벗겨지고 글자가 낱개로 흩어집니다.
   통째로 커졌다 사라지는 것보다 손맛이 훨씬 큽니다. */
function burstText(f){
  var node=f.el;
  node.classList.remove('lock');
  // 글자를 낱개로 쪼개면 줄바꿈 자리가 달라져 상자가 출렁입니다. 먼저 크기를 못박습니다.
  node.style.width=node.offsetWidth+'px';
  node.style.height=node.offsetHeight+'px';
  node.classList.add('pop');
  var txt=f.text;
  node.innerHTML='';
  for(var i=0;i<txt.length;i++){
    var s=document.createElement('span');
    s.className='ch';
    s.textContent = txt[i]===' ' ? '\u00a0' : txt[i];
    node.appendChild(s);
  }
  var chars=node.children;
  requestAnimationFrame(function(){
    for(var i=0;i<chars.length;i++){
      var ang=-Math.PI/2+(Math.random()-0.5)*2.5;
      var dist=34+Math.random()*90;
      chars[i].style.transform=
        'translate('+(Math.cos(ang)*dist).toFixed(0)+'px,'+
                     (Math.sin(ang)*dist*0.75+22).toFixed(0)+'px) '+
        'rotate('+((Math.random()-0.5)*150).toFixed(0)+'deg) '+
        'scale('+(0.45+Math.random()*0.85).toFixed(2)+')';
      chars[i].style.opacity='0';
    }
  });
  setTimeout(function(){ node.remove(); },660);
}
/* 맞은 자리에 남는 파문 */
function hitRing(leftPct, topPx, scale){
  var r=document.createElement('div');
  r.className='hitring';
  r.style.left=leftPct; r.style.top=topPx+'px';
  el.zone.appendChild(r);
  requestAnimationFrame(function(){
    r.style.transform='translate(-50%,-50%) scale('+scale.toFixed(2)+')';
    r.style.opacity='0';
  });
  setTimeout(function(){ r.remove(); },560);
}

function complete(f){
  f.done=true;
  hitRing(f.el.style.left, f.y+f.el.offsetHeight/2, 1.6+Math.min(1.6,S.combo*0.09));
  burstText(f);
  falls.splice(falls.indexOf(f),1);
  el.input.value=''; el.input.classList.remove('nomatch');

  S.score++; S.combo++;
  if(S.combo>S.best) S.best=S.combo;

  // 콤보 유지 창을 다시 채웁니다. 놓친 문장은 여기에 아무 영향이 없습니다.
  S.comboMax = D.WINDOW*(1-(1-COMBO_TIGHTEN)*Math.min(1,S.combo/20));
  S.comboT = S.comboMax;

  // 한 장이 채우는 양이 콤보에 비례합니다.
  // 빨리 이어 치는 사람은 여기서 판을 통째로 줄여버립니다.
  var mult = 1 + Math.min(S.combo,COMBO_GAIN_CAP)*COMBO_GAIN;
  S.gauge=Math.min(100,S.gauge+D.GAIN*mult);

  if(S.combo>=2){
    sfxBlip(S.combo);
    el.combo.classList.remove('punch');
    void el.combo.offsetWidth;          // 애니메이션을 매번 다시 걸기 위한 리플로
    el.combo.classList.add('punch');
  }
  // 다섯 칸마다 화음이 한 계단 올라갑니다
  var step=Math.floor(S.combo/5);
  if(step>S.fanfare){ S.fanfare=step; sfxFanfare(step); flash(0.22); }

  // 받을 때마다 한 번 웁니다. 콤보가 쌓일수록 높고 까랑까랑하게.
  sfxCall((480+Math.min(S.combo,22)*28)*(1-0.42*EXH),
          (0.5+Math.min(S.combo,10)*0.02)*(1-0.3*EXH),
          EXH>0.55 ? 0.72 : 1.62,
          (0.13+Math.min(S.combo,12)*0.006)*(1-0.45*EXH));
  var mv=pickMoves(S.combo);
  for(var i=0;i<mv.length;i++){
    if(S.queue.length>=8) break;   // 큐가 길면 반응이 늦어 보입니다
    S.queue.push(mv[i]);
  }
  paint();
}

function missLine(f){
  f.done=true;
  f.el.classList.remove('lock');
  falls.splice(falls.indexOf(f),1);
  if(S.dead){
    // 아무도 받지 않는다 — 수면에 눕는다
    f.el.classList.add('flat');
    f.el.style.top=(WATERLINE-10+Math.random()*30)+'px';
    f.el.style.transform='translateX(-50%) rotate('+((Math.random()-0.5)*9).toFixed(1)+'deg)';
    deadPile.push({el:f.el, x:parseFloat(f.el.style.left), vx:(Math.random()-0.5)*0.4});
    if(deadPile.length>16){
      var g=deadPile.shift();
      g.el.style.transition='opacity 2s'; g.el.style.opacity='0';
      setTimeout(function(){ g.el.remove(); },2100);
    }
    return;
  }
  f.el.classList.add('sink');
  f.el.style.opacity='0';
  f.el.style.transform='translateX(-50%) translateY(28px) scale(.92)';
  var node=f.el;
  setTimeout(function(){ node.remove(); },950);
  // 놓쳐도 콤보는 그대로입니다. 문장은 원래 넘치게 떨어지는 것이고,
  // 전부 받아내라는 규칙이었기 때문에 콤보가 안 터졌습니다.
  sfxMiss();
}

function die(){
  S.dead=true;
  LAST={ time: Math.round(S.run*10)/10, score: S.score, best: S.best, mode: MODE };
  submitRun();
  // 넘길 수 없습니다. 끝까지 보게 두는 게 이 게임의 요점입니다.
  later(showOver, 16600);
  S.queue.length=0; S.cur=null; S.combo=0; S.comboT=0; S.fanfare=0; FEVER=0;
  el.input.value='';
  /* disabled 로 만들면 포커스가 문서 몸통으로 빠집니다.
     그 뒤에 친 백스페이스가 브라우저의 뒤로가기로 먹혔습니다.
     읽기전용으로 두고 포커스를 잡고 있으면 글자도 안 들어가고 페이지도 안 넘어갑니다. */
  el.input.readOnly=true;
  if('ontouchstart' in window) el.input.blur(); else el.input.focus();
  el.input.classList.remove('nomatch');
  falls.forEach(function(f){ f.el.classList.remove('lock'); f.el.textContent=f.text; });
  sfxCall(300,3.6,0.16,0.34);
  later(function(){ sfxSplash(2.2,false); },320);
  // 정적 중에 버튼이 먼저 빛나면 시선을 뺏겨서, 결과창과 같이 켭니다.
  later(function(){ el.reset.classList.add('hot'); },16400);
  paint();
}

function startRaid(){
  S.raid=1; S.raidT=0; S.nextThrow=2.5; S.dead=true;
  S.queue.length=0; S.cur=null; S.combo=0; S.comboT=0; S.fanfare=0; FEVER=0;
  el.input.readOnly=true;
  if('ontouchstart' in window) el.input.blur(); else el.input.focus();
  el.glow.style.opacity='0';
  if(whaleMat) whaleMat.emissive.setRGB(0,0,0);
  if(!boat) boat=buildBoat();
  startEngine();
  later(function(){ el.reset.classList.add('hot'); },3200);
  paint();
}


/* ════════ 루프 ════════ */
var last=performance.now();
function loop(now){
  var raw=Math.min(0.05,(now-last)/1000); last=now;
  // 타격 순간 화면을 아주 잠깐 잡아둡니다. 짧아서 조작에는 영향이 없습니다.
  var dt=raw;
  if(hitstop>0){ hitstop-=raw; dt=raw*0.16; }
  S.t+=dt;
  if(!S.dead && started) S.run+=raw;

  // 콤보는 시간으로만 풀립니다
  if(!S.dead && started && S.combo>0){
    S.comboT-=raw;
    if(S.comboT<=0){
      if(S.combo>=2) sfxComboDrop();
      S.combo=0; S.comboT=0; S.fanfare=0;
      paint();
    }
  }
  var fTarget = Math.min(1, S.combo/13);
  FEVER += (fTarget-FEVER)*Math.min(1, raw*(fTarget>FEVER?5.5:2.2));

  if(!S.raid && started){
    S.spawnT-=dt;
    if(S.spawnT<=0){
      if(falls.length<maxOnScreen()){
        spawnLine();
        var gap=D.GAP_SLOW+(D.GAP_FAST-D.GAP_SLOW)*progress();
        // 다 쳐서 화면이 비어 있으면 더 빨리 내려보냅니다.
        // 잘 치는 사람은 문장이 쏟아지고, 못 따라가면 원래 속도로 돌아옵니다.
        var load=falls.length/Math.max(1,maxOnScreen());
        gap*=(0.38+0.92*load);
        S.spawnT=gap*(0.85+Math.random()*0.3);
      } else {
        S.spawnT=0.4;   // 꽉 찼으면 잠깐 뒤 다시 확인
      }
    }
  }

  for(var i=falls.length-1;i>=0;i--){
    var f=falls[i];
    // 키패드가 올라와 화면이 줄어도 주어진 시간은 같아야 합니다.
    // 거리로 재면 수면선이 올라온 만큼 갑자기 빨리 떨어집니다.
    f.p+=dt/f.dur;
    f.y=-60+f.p*(WATERLINE+60);
    f.el.style.top=f.y+'px';
    if(f.p>=1) missLine(f);
  }
  for(var dpi=0;dpi<deadPile.length;dpi++){
    var dp=deadPile[dpi];
    dp.x+=dp.vx*dt;
    dp.el.style.left=dp.x+'%';
  }

  var perf=0,cost=0;
  if(!S.dead){
    if(!S.cur&&S.queue.length){
      S.cur=S.queue.shift(); S.curT=0;
      // 브리치와 도약은 옆으로 크게 밀고 나갑니다.
      // 방향을 매번 안쪽으로 잡지 않으면 한쪽으로만 쌓여 화면 밖에서 춤추게 됩니다.
      S.o={x:whale.position.x,z:whale.position.z,y:REST_Y,
           dir:whale.position.x>0?-1:1,
           pitch:0,roll:0,lean:0,yawSpin:0,rollSpin:0,tail:0,finWave:0,seg:-1};
    }
    if(S.cur){
      // 큐가 밀려 있으면 현재 기술을 빨리 감습니다.
      // 콤보가 터진 순간 고래가 정신없이 몰아치는 건 대부분 이 한 줄에서 나옵니다.
      var qspd = 1 + Math.min(1.25, S.queue.length*0.20);
      var M=MOVES[S.cur]; S.curT+=dt*exhSpd()*qspd;
      var u=Math.min(1,S.curT/M.dur);
      S.o.yawSpin=0;S.o.rollSpin=0;S.o.tail=0;S.o.finWave=0;S.o.lean=0;S.o.roll=0;
      M.run(u,S.o,dt);
      S.o.x=Math.max(-9,Math.min(9,S.o.x));   // 카메라 화각 안에 묶어둡니다
      // 지칠수록 같은 기술이라도 덜 뜨고 덜 젖힙니다
      var am=exhAmp();
      if(am<1){
        S.o.y=REST_Y+(S.o.y-REST_Y)*am;
        S.o.pitch*=am; S.o.roll*=am; S.o.lean*=am;
        S.o.tail*=am; S.o.yawSpin*=am; S.o.rollSpin*=am;
      }
      perf=1; cost=M.cost;
      if(u>=1) S.cur=null;
    }
  }

  if(!S.dead && started){
    var mult=1+Math.min(20,S.combo)*0.035;
    // 지친 몸으로 억지로 움직이는 쪽이 더 소모가 큽니다.
    // 이게 없으면 마지막에 꿈틀거리기만 하다가 판이 한없이 늘어집니다.
    var burn = D.RATE*cost*mult*(1+EXH*1.2);
    var rest = GAUGE_DECAY*(1-EXH);          // 한 번 넘어가면 회복이 안 됩니다
    S.gauge=Math.max(0,Math.min(100,S.gauge+(perf?burn:-rest)*dt));
    EXH=Math.max(0,Math.min(1,(S.gauge-40)/58));
    if(EXH>0){
      S.pantT-=dt;
      if(S.pantT<=0){
        sfxPant(EXH); puff(EXH);
        S.pantT=(1.6-EXH*1.05)*(0.85+Math.random()*0.3);
      }
    }
    if(S.gauge>=100) die();
    paint();
  }

  if(!S.dead){
    S.nextBlow-=dt;
    if(S.nextBlow<=0){ blow(); S.nextBlow=(5.5+Math.random()*3.5)*(1-0.55*EXH); }
  }

  // 콤보가 붙으면 판 전체가 달아오릅니다. 밝기는 유지하고 채도만 올립니다.
  if(!S.dead && started){
    var fv=FEVER;
    scene.background.copy(SKY_LIVE).lerp(SKY_HOT, fv*0.42);
    scene.fog.color.copy(scene.background);
    water.material.color.copy(SEA_LIVE).lerp(SEA_HOT, fv*0.70);
    water.material.opacity=0.66+fv*0.10;
    if(whaleMat) whaleMat.emissive.setRGB(fv*0.20, fv*0.11, fv*0.02);
    sparkle.material.size=3.2+fv*2.2;
    el.glow.style.opacity=(fv*0.62).toFixed(2);
  }

  if(S.dead && !S.raid){
    if(whaleMat) whaleMat.emissive.setRGB(0,0,0);
    el.glow.style.opacity='0';
    S.deadT+=dt;
    S.wash=Math.min(1,S.wash+dt*0.10);
    if(label){
      if(!labelOff && S.deadT>2.1){
        labelOff=1; scene.attach(label);
        label.userData.p=label.position.clone();
        label.userData.q=label.quaternion.clone();
      }
      if(labelOff){
        var lp=ease01((S.deadT-2.1)/3.6);
        label.position.lerpVectors(label.userData.p,LBL_P,lp);
        label.position.y+=Math.sin(S.t*0.55)*0.05*lp;    // 파도에 가끔 씻길 정도만
        label.quaternion.copy(label.userData.q).slerp(LBL_Q,lp);
      }
    }
    scene.background.copy(SKY_LIVE).lerp(SKY_DEAD,S.wash);
    scene.fog.color.copy(SKY_LIVE).lerp(SKY_DEAD,S.wash);
    scene.fog.near=60-S.wash*46;
    scene.fog.far=200-S.wash*128;
    water.material.color.copy(SEA_LIVE).lerp(SEA_DEAD,S.wash);
    water.material.opacity=0.66-S.wash*0.18;
  }

  var wp=water.geometry.attributes.position;
  var amp=S.dead?0.45:(1+(perf?1.7:0))*(1+FEVER*0.55);
  // 시간 쪽 sin·cos 여섯 개만 매 프레임 구하고, 정점 쪽은 미리 만든 표를 씁니다.
  var t1=S.t*1.3, t2=S.t*1.0, t3=S.t*2.2;
  var s1=Math.sin(t1), c1=Math.cos(t1);
  var s2=Math.sin(t2), c2=Math.cos(t2);
  var s3=Math.sin(t3), c3=Math.cos(t3);
  for(var wi=0;wi<wp.count;wi++){
    wp.array[wi*3+1]=((W1S[wi]*c1+W1C[wi]*s1)
                     +(W2S[wi]*c2-W2C[wi]*s2)
                     +(W3S[wi]*c3-W3C[wi]*s3))*amp;
  }
  wp.needsUpdate=true;
  water.geometry.computeVertexNormals();

  squash=Math.max(0,squash-dt*3.2);
  if(S.raid){
    whale.position.y+=(-5.4-whale.position.y)*Math.min(1,dt*1.1);
    whaleBody.rotation.x*=(1-Math.min(1,dt*3));
    whaleBody.rotation.z*=(1-Math.min(1,dt*3));
    tailPivot.rotation.x*=(1-Math.min(1,dt*3));
  } else if(S.dead){
    S.flip+=(2.705-S.flip)*Math.min(1,dt*0.85);   // 155도. 삐뚤게 굳은 쪽이 더 죽어 보입니다
    whale.position.y+=(0.12-whale.position.y)*Math.min(1,dt*0.7);
    whale.position.x+=(0-whale.position.x)*Math.min(1,dt*0.7);
    whale.rotation.y+=(0-whale.rotation.y)*Math.min(1,dt*0.7);
    whale.rotation.z+=(0-whale.rotation.z)*Math.min(1,dt*0.7);
    whaleBody.rotation.set(Math.sin(S.t*0.42)*0.035,0,S.flip);
    tailPivot.rotation.x=Math.sin(S.t*0.42)*0.04;
    finPivots.forEach(function(fp){ fp.pv.rotation.z+=(0-fp.pv.rotation.z)*Math.min(1,dt*2); });
  } else if(S.cur){
    var o=S.o;
    S.yaw+=o.yawSpin; S.roll+=o.rollSpin;
    whale.position.set(o.x,o.y,o.z);
    whale.rotation.y=S.yaw; whale.rotation.z=o.lean||0;
    whaleBody.rotation.x=o.pitch;
    whaleBody.rotation.z=S.roll+(o.roll||0);
    tailPivot.rotation.x=o.tail;
    finPivots.forEach(function(fp){
      fp.pv.rotation.z=o.finWave?-fp.s*(0.4+0.9*Math.sin(S.t*16))*o.finWave:0;
    });
  } else {
    // 지칠수록 느리게, 낮게, 꼬리도 힘없이
    var ea=exhAmp();
    S.swim+=dt*0.75*(1-0.55*EXH);
    whale.position.y+=((REST_Y-EXH*0.55)+Math.sin(S.swim*1.3)*0.5*ea-whale.position.y)*Math.min(1,dt*2.2);
    whale.position.x+=(Math.sin(S.swim*0.55)*3.5*(1-0.6*EXH)-whale.position.x)*Math.min(1,dt*1.4);
    S.yaw+=(Math.sin(S.swim*0.55+1.57)*0.45*(1-0.5*EXH)-S.yaw)*Math.min(1,dt*1.6);
    S.roll+=(0-S.roll)*Math.min(1,dt*2.2);
    whale.rotation.y=S.yaw;
    // 옆으로 슬슬 기울어집니다
    whale.rotation.z+=(EXH*0.18*Math.sin(S.swim*0.7)-whale.rotation.z)*Math.min(1,dt*3);
    whaleBody.rotation.x+=((Math.sin(S.swim*1.3+1)*0.10*ea-EXH*0.10)-whaleBody.rotation.x)*Math.min(1,dt*3);
    whaleBody.rotation.z+=(S.roll-whaleBody.rotation.z)*Math.min(1,dt*3);
    tailPivot.rotation.x=Math.sin(S.swim*Math.PI*2)*0.32*(1-0.6*EXH);
    finPivots.forEach(function(fp){ fp.pv.rotation.z+=(0-fp.pv.rotation.z)*Math.min(1,dt*4); });
  }
  whaleBody.scale.set(1+squash*0.20,1-squash*0.24,1+squash*0.10);

  var sp=splash.geometry.attributes.position;
  for(var k=0;k<SPLASH_MAX;k++){
    var p=splashData[k];
    if(!p.live){ sp.array[k*3+1]=-999; continue; }
    p.life+=dt;
    if(p.life>=p.max){ p.live=false; sp.array[k*3+1]=-999; continue; }
    p.vy-=18*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.y<0&&p.vy<0){ p.live=false; sp.array[k*3+1]=-999; continue; }
    sp.array[k*3]=p.x; sp.array[k*3+1]=p.y; sp.array[k*3+2]=p.z;
  }
  sp.needsUpdate=true;

  var kp=sparkle.geometry.attributes.position;
  for(var kk2=0;kk2<SPK_MAX;kk2++){
    var q2=spkData[kk2];
    if(!q2.live){ kp.array[kk2*3+1]=-999; continue; }
    q2.life+=dt;
    if(q2.life>=q2.max){ q2.live=false; kp.array[kk2*3+1]=-999; continue; }
    q2.vy-=15*dt;
    q2.x+=q2.vx*dt; q2.y+=q2.vy*dt; q2.z+=q2.vz*dt;
    if(q2.y<0&&q2.vy<0){ q2.live=false; kp.array[kk2*3+1]=-999; continue; }
    kp.array[kk2*3]=q2.x; kp.array[kk2*3+1]=q2.y; kp.array[kk2*3+2]=q2.z;
  }
  kp.needsUpdate=true;
  sparkle.material.opacity = S.dead ? 0 : 0.95;

  for(var q=0;q<RING_MAX;q++){
    var rr=rings[q];
    if(!rr.live) continue;
    rr.t+=dt;
    var kk=rr.t/rr.max;
    if(kk>=1){ rr.live=false; rr.mesh.visible=false; continue; }
    rr.mesh.scale.setScalar(0.6+kk*rr.grow);
    rr.mesh.material.opacity=0.55*(1-kk);
  }

  if(S.raid&&boat){
    S.raidT+=dt;
    var k2=Math.min(1,S.raidT/2.4),ease=1-Math.pow(1-k2,3);
    boat.position.x=36+(2-36)*ease;
    boat.position.z=-50+(6+50)*ease;
    boat.rotation.y=-0.5+0.35*ease;
    boat.position.y=Math.sin(S.t*2.2)*0.24;
    boat.rotation.z=Math.sin(S.t*1.7)*0.06;
    throwers.forEach(function(pp,ii){
      pp.rotation.z=Math.sin(S.t*10+pp.userData.ph)*0.26;
      pp.rotation.y=Math.sin(S.t*4.5+ii)*0.34;
    });
    if(S.raidT>2.8){
      S.nextThrow-=dt;
      if(S.nextThrow<=0){
        throwRock(throwers[Math.floor(Math.random()*throwers.length)]);
        S.nextThrow=0.42+Math.random()*0.45;
      }
    }
  }
  for(var r=rocks.length-1;r>=0;r--){
    var ro=rocks[r];
    ro.t+=dt; ro.vy-=16*dt;
    ro.mesh.position.x+=ro.vx*dt;
    ro.mesh.position.y+=ro.vy*dt;
    ro.mesh.position.z+=ro.vz*dt;
    ro.mesh.rotation.x+=ro.spin.x*dt;
    ro.mesh.rotation.y+=ro.spin.y*dt;
    if(ro.t>=ro.max){ scene.remove(ro.mesh); rocks.splice(r,1); shake=1; popSplat(); sfxThud(); }
  }

  shake=Math.max(0,shake-raw*2.3);
  var sk=shake*shake;                       // 초반이 세고 꼬리가 짧게 빠집니다
  var sx=(Math.random()-0.5)*sk*3.6, sy=(Math.random()-0.5)*sk*3.6;
  var wy=Math.max(0,whale.position.y);
  var camX=sx, camY=8.5+wy*0.30+sy, camZ=34-sk*2.2;
  var aimX=whale.position.x*0.55+sx*0.4, aimY=2.5+wy*0.42, aimZ=0;
  if(S.deadT>0){
    // 1.5초는 그대로 두고 봅니다. 그 뒤 6초에 걸쳐 앞으로 돌아 들어갑니다.
    var cp=ease01((S.deadT-1.5)/6.0);
    var hp=ease01((S.deadT-7.5)/6.8);            // 붙은 뒤에도 아주 천천히 더 밀고 들어갑니다
    var arc=cp*Math.PI*0.92;                     // 꼬리 쪽에서 얼굴 쪽으로 돌아 나갑니다
    // 세로 화면은 폭이 좁아서 같은 거리면 머리와 라벨이 잘립니다.
    var ar=camera.aspect||1;
    var endR=5.3+(ar<1?Math.min(2.6,(1/ar-1)*2.5):0);
    var rad=34+(endR-34)*cp-hp*0.42;
    camX=sx+Math.sin(arc)*rad*0.52;
    camY=(8.5+wy*0.30+sy)+((1.05-hp*0.12)-(8.5+wy*0.30+sy))*cp;
    camZ=Math.cos(arc)*rad-sk*2.2*(1-cp);
    aimX=aimX*(1-cp)+(-0.08)*cp;
    aimY=aimY*(1-cp)+0.30*cp;
    aimZ=aimZ*(1-cp)+(-2.90)*cp;
  }
  camera.position.set(camX,camY,camZ);
  camera.up.set(Math.sin(S.t*31)*sk*0.05,1,0);
  camera.lookAt(aimX,aimY,aimZ);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}


/* ════════ 입력 ════════ */
/* 판이 도는 동안에는 브라우저 쪽 단축키를 막습니다.
   포커스가 잠깐 어긋난 사이에 백스페이스나 알트+화살표가 뒤로가기로 먹히면
   판이 통째로 날아갑니다. 스페이스·화살표는 화면이 밀리는 것을 막는 것입니다. */
var NAVKEYS={Backspace:1,' ':1,Spacebar:1,ArrowUp:1,ArrowDown:1,
             PageUp:1,PageDown:1,Home:1,End:1};
window.addEventListener('keydown',function(ev){
  if(!started) return;
  var t=ev.target;
  if(t && (t.tagName==='BUTTON'||t.tagName==='TEXTAREA'||t.tagName==='A')) return;
  if(t && t.tagName==='INPUT' && !t.readOnly) return;
  if(ev.altKey && (ev.key==='ArrowLeft'||ev.key==='ArrowRight')){ ev.preventDefault(); return; }
  if(ev.ctrlKey||ev.metaKey) return;
  if(NAVKEYS[ev.key]) ev.preventDefault();
},true);
el.input.addEventListener('input',function(){
  unlock();
    
  if(S.dead) return;
  var matched=updateMatch();
  // 대본에서 벗어난 입력일 때만 악플을 본다
  if(!matched && nsp(el.input.value).length>=2){
    if(detectBad(el.input.value)) startRaid();
  }
});
el.input.addEventListener('focus',function(){
  setTimeout(fitViewport,120);
  setTimeout(checkKeyboard,450);
  setTimeout(checkKeyboard,900);
});
el.input.addEventListener('blur',function(){
  kbGuess=0;
  setTimeout(function(){ fullH=Math.max(fullH, viewH()); fitViewport(); },150);
});
el.input.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); el.input.value=''; updateMatch(); }
  if(ev.key==='Escape'){ el.input.value=''; updateMatch(); }
});
document.getElementById('stage').addEventListener('pointerdown',function(ev){
  if(S.dead || !started) return;
  if(ev.target.closest('button') || ev.target===el.input) return;
  setTimeout(function(){ el.input.focus(); },0);
});
el.clear.addEventListener('click',function(){
  el.input.value=''; updateMatch(); el.input.focus();
});
el.reset.addEventListener('click',function(){ unlock(); closeAll(); reset(); el.input.focus(); });


/* ════════ 모드 · 기록 · 순위 ════════ */
/* 앱스스크립트 웹앱을 배포한 뒤 /exec 주소를 여기에 붙이면 순위가 공유됩니다.
   비워두면 순위 버튼이 숨고 게임만 돌아갑니다. */
var RANK_URL = 'https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec';

var started = false;
var LAST = null;
var myName = '';
var myId = '';
var rankMode = 'phone';
try {
  myName = window.localStorage.getItem('whale_name') || '';
  myId   = window.localStorage.getItem('whale_id') || '';
  var sm = window.localStorage.getItem('whale_mode');
  if(sm==='key'||sm==='phone') MODE=sm;
}catch(e){}
if(!myId){
  myId=(Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,'').slice(0,12);
  try{ window.localStorage.setItem('whale_id', myId); }catch(e){}
}

var V = {
  start:document.getElementById('startV'), over:document.getElementById('overV'),
  rank:document.getElementById('rankV'), list:document.getElementById('rankList'),
  name:document.getElementById('wname'),
  ovTime:document.getElementById('ovTime'), ovSub:document.getElementById('ovSub')
};
V.name.value = myName;

function fmtSec(v){
  var m=Math.floor(v/60), r=v-m*60;
  return m ? m+'분 '+r.toFixed(1)+'초' : r.toFixed(1)+'초';
}
function closeAll(){
  V.start.classList.remove('on'); V.over.classList.remove('on'); V.rank.classList.remove('on');
}
function setMode(m){
  MODE = m; D = DIFF[m]; rankMode = m;
  try{ window.localStorage.setItem('whale_mode', m); }catch(e){}
  paintModeBtns();
}
function paintModeBtns(){
  [['mPhone','phone'],['oPhone','phone'],['mKey','key'],['oKey','key']].forEach(function(p){
    document.getElementById(p[0]).classList.toggle('sel', MODE===p[1]);
  });
  document.getElementById('rPhone').classList.toggle('sel', rankMode==='phone');
  document.getElementById('rKey').classList.toggle('sel', rankMode==='key');
}

function beginGame(m){
  setMode(m);
  unlock(); closeAll(); reset();
  started = true;
  el.input.focus();
}

function showOver(){
  if(!LAST || S.raid) return;         // 포경선으로 끝난 판은 기록하지 않습니다
  V.ovTime.innerHTML = fmtSec(LAST.time).replace(/([0-9.]+)(초|분)/g,
    function(_,a,b){ return a+'<small>'+b+'</small>'; });
  V.ovSub.textContent = '받은 문장 ' + LAST.score + ' · 최고 콤보 ' + LAST.best;
  paintModeBtns();
  V.over.classList.add('on');
}

function rankOn(){ return !!RANK_URL; }

function rankFetch(mode, cb){
  if(!rankOn()){ cb(null); return; }
  var done=false, fn='whaleCb'+Date.now().toString(36);
  var sc=document.createElement('script');
  function cleanup(){
    try{ delete window[fn]; }catch(e){ window[fn]=undefined; }
    if(sc.parentNode) sc.parentNode.removeChild(sc);
  }
  function fail(){ if(done) return; done=true; cleanup(); cb(null); }
  window[fn]=function(list){ if(done) return; done=true; cleanup(); cb(list); };
  sc.onerror=fail;
  sc.src=RANK_URL+(RANK_URL.indexOf('?')>=0?'&':'?')+
         'game=whale&mode='+mode+'&callback='+fn+'&t='+Date.now();
  document.head.appendChild(sc);
  setTimeout(fail, 6000);
}

function submitRun(){
  if(!rankOn() || !LAST || !myName || S.raid) return;
  // 죽는 순간 한 번, 결과창에서 다시·순위를 누를 때 또 한 번 불립니다.
  // 이름을 나중에 적는 흐름 때문에 두 번 다 필요하지만, 같은 이름으로 두 번 보내면 안 됩니다.
  if(LAST.sentAs === myName) return;
  LAST.sentAs = myName;
  var run = LAST;
  try{
    fetch(RANK_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ game:'whale', id:myId, name:myName, mode:LAST.mode,
                             time:LAST.time, score:LAST.score, best:LAST.best }),
      keepalive:true
    }).catch(function(){ run.sentAs=null; });  // 못 보냈으면 결과창에서 다시 눌러 재시도
  }catch(e){ run.sentAs=null; }
}

function readName(){
  var v=(V.name.value||'').replace(/\s+/g,' ').trim().slice(0,8);
  if(v && v!==myName){
    myName=v;
    try{ window.localStorage.setItem('whale_name', myName); }catch(e){}
  }
  return myName;
}

function renderRank(list){
  V.list.innerHTML='';
  if(!list || !list.length){
    var e0=document.createElement('div'); e0.className='rk'; e0.textContent='—';
    V.list.appendChild(e0); return;
  }
  var prev=null, r=0;
  for(var i=0;i<list.length;i++){
    if(list[i].time!==prev){ r=i+1; prev=list[i].time; }
    var row=document.createElement('div');
    row.className='rk'+(myName && list[i].name===myName ? ' me' : '');
    var a=document.createElement('i'); a.textContent=r;
    var b=document.createElement('b'); b.textContent=list[i].name;
    var c=document.createElement('u'); c.textContent=fmtSec(list[i].time);
    row.appendChild(a); row.appendChild(b); row.appendChild(c);
    V.list.appendChild(row);
  }
}
function openRank(mode){
  rankMode = mode || rankMode;
  paintModeBtns();
  V.rank.classList.add('on');
  V.list.innerHTML='<div class="rk">…</div>';
  rankFetch(rankMode, renderRank);
}

document.getElementById('mPhone').addEventListener('click',function(){ beginGame('phone'); });
document.getElementById('mKey').addEventListener('click',function(){ beginGame('key'); });
document.getElementById('oPhone').addEventListener('click',function(){ setMode('phone'); });
document.getElementById('oKey').addEventListener('click',function(){ setMode('key'); });
document.getElementById('ovAgain').addEventListener('click',function(){
  readName(); submitRun(); closeAll(); reset(); started=true; el.input.focus();
});
document.getElementById('ovRank').addEventListener('click',function(){
  readName(); submitRun(); setTimeout(function(){ openRank(MODE); }, 900);
});
document.getElementById('startRank').addEventListener('click',function(){ openRank(MODE); });
document.getElementById('rPhone').addEventListener('click',function(){ openRank('phone'); });
document.getElementById('rKey').addEventListener('click',function(){ openRank('key'); });
document.getElementById('rankClose').addEventListener('click',function(){
  V.rank.classList.remove('on');
  if(!started) V.start.classList.add('on');
  else if(S.dead && LAST) V.over.classList.add('on');
});
if(!rankOn()){
  document.getElementById('startRank').style.display='none';
  document.getElementById('ovRank').style.display='none';
  V.name.style.display='none';
}
// 터치 기기면 폰을 기본으로 잡아둡니다
if(!('ontouchstart' in window) && window.innerWidth>820) setMode('key');
else setMode(MODE);
el.mute.addEventListener('click',function(){
  unlock(); muted=!muted;
  if(master) master.gain.value=muted?0:0.85;
  el.mute.textContent=muted?'🔇':'🔊';
});

init3D(); fullH=Math.max(window.innerHeight, viewH()); fitViewport();
reset(); requestAnimationFrame(loop);

})();
</script>
</body>
</html>
