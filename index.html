<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#b7e5ed">
<meta name="description" content="따뜻한 말 한마디를 선물해 주세요. 고래 칭찬하기.">
<title>고래 칭찬하기</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c4ecf1'/%3E%3Cpath d='M10 34Q11 24 24 26Q37 26 41 37Q49 38 51 29L48 26Q55 24 59 21Q59 31 55 33Q54 49 36 50H26Q10 50 10 34' fill='%23295871'/%3E%3Cpath d='M13 39Q24 47 42 43Q35 51 24 47Q16 46 13 39' fill='%23fff6d6'/%3E%3Ccircle cx='20' cy='34' r='2.3' fill='%230c2738'/%3E%3Ccircle cx='19.5' cy='33.2' r='.8' fill='white'/%3E%3Cpath d='M25 24V13Q23 7 18 10M25 17Q28 7 34 11' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#214f64;--deep:#194457;--cream:#fff9e7;--gold:#ffc54e;--vh:100dvh;--dockTop:calc(100dvh - 118px);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#b7e5ed;color:var(--ink);font-family:'Arial Rounded MT Bold','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button,input,a{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ff913f;outline-offset:5px}
#app{position:relative;width:100%;max-width:720px;height:var(--vh);min-height:280px;margin:auto;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#b5e4ef 0%,#e6f4ed 60%,#9bdcdf 100%);transition:background 3s}
#sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity 4s}
.sun{position:absolute;left:10%;top:24%;width:75px;height:75px;border-radius:50%;background:#fff9de;box-shadow:0 0 70px 35px #fff6d180;opacity:.9}
.cloud{position:absolute;width:110px;height:25px;border-radius:50%;background:#fff9;filter:blur(1px);animation:cloud 26s ease-in-out infinite alternate}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:100%}.cloud:before{width:52px;height:39px;left:22px;bottom:0}.cloud:after{width:40px;height:30px;left:56px;bottom:0}
.cloud.a{top:27%;left:-4%}.cloud.b{top:34%;right:-3%;transform:scale(.8);animation-delay:-12s}.cloud.c{top:15%;right:8%;opacity:.5;transform:scale(.6)}
@keyframes cloud{to{translate:28px 5px}}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px #28535b00;transition:box-shadow 6s;background:linear-gradient(180deg,#fff0 70%,#17324100)}
#arcadeFace{position:absolute;z-index:46;display:block;width:38px;height:38px;padding:6px;line-height:0;left:calc(6px + env(safe-area-inset-left));top:calc(6px + var(--safeT));touch-action:manipulation}
#arcadeFace svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(1px 2px 1.5px #0006)}#arcadeFace:active svg{transform:scale(.88)}
#tools{position:absolute;right:12px;top:calc(10px + var(--safeT));display:flex;gap:6px;z-index:45}
.iconbtn{border:1px solid #fff9;width:36px;height:36px;border-radius:50%;background:#fff8;color:var(--ink);display:grid;place-items:center;padding:8px;box-shadow:0 2px 0 #385c681a}.iconbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.iconbtn:active{transform:translateY(2px)}
#settings{position:absolute;right:14px;top:calc(55px + var(--safeT));z-index:50;border:1px solid #ffffffd0;border-radius:18px;padding:9px;background:#fffffff2;box-shadow:0 10px 40px #234e6333;min-width:174px}#settings[hidden]{display:none}#settings button{display:block;width:100%;padding:12px;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:750;text-align:left;border-radius:11px}#settings button:hover{background:#dff1f1}#settings button+button{border-top:1px solid #28536813}
#intro{position:absolute;inset:0;z-index:15;pointer-events:none;transition:opacity .65s,visibility .65s}
#intro.gone{opacity:0;visibility:hidden}
#logo{position:absolute;top:calc(10.5% + var(--safeT));left:0;right:0;text-align:center;animation:logoIn .9s both}
.kicker{display:inline-block;margin:0 0 10px;padding:5px 11px;border-radius:99px;background:#fff9;color:#467682;font-size:11px;font-weight:750;letter-spacing:.13em}
h1{margin:0;font-weight:1000;line-height:1.04;letter-spacing:-.065em;transform:rotate(-3deg);filter:drop-shadow(0 5px 0 #193e5950)}
h1 span{display:block;width:max-content;margin:auto;color:#fffcec;font-size:clamp(55px,12vw,83px);paint-order:stroke fill;-webkit-text-stroke:7px #26546a;text-shadow:0 2px 0 #c7e0df}
h1 strong{display:block;width:max-content;margin:3px auto 0;color:#ffd268;font-size:clamp(46px,10.1vw,68px);paint-order:stroke fill;-webkit-text-stroke:6px #26546a;text-shadow:0 3px 0 #e49336}
.logo-star{position:absolute;left:calc(50% + 113px);top:29px;font-size:26px;color:#fffcee;transform:rotate(16deg);text-shadow:0 2px 0 #e3bc66}
@keyframes logoIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
#startArea{position:absolute;left:22px;right:22px;bottom:calc(6.5% + var(--safeB));text-align:center;pointer-events:auto}
#startArea p{margin:0 0 14px;font-size:14px;font-weight:650;color:#285a6c;text-shadow:0 1px 0 #fffa}
.bigbtn{border:3px solid #fff4c4;border-radius:22px;background:linear-gradient(#ffd974,#ffc14a);color:#784b21;min-height:60px;padding:12px 52px;font-size:22px;font-weight:900;letter-spacing:-.035em;box-shadow:0 6px 0 #ce9140,0 10px 25px #34657526;text-shadow:0 1px 0 #fff6;position:relative}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #ce9140,0 5px 15px #34657522}
.bigbtn .star{font-size:17px;display:inline-block;margin-right:11px;color:#fffef4;vertical-align:2px}
#introHint{display:block;margin-top:17px;color:#46727e;font-size:11px;font-weight:600;letter-spacing:.02em}
#hud{position:absolute;left:52px;top:calc(17px + var(--safeT));z-index:12;opacity:0;transition:opacity .6s;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;pointer-events:none}#hud b{font-size:18px;font-variant-numeric:tabular-nums;color:#25576a}#hud .heart{color:#efad66;font-size:14px}
#words{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.word{position:absolute;left:50%;width:max-content;max-width:calc(100% - 38px);padding:9px 18px;border:2px solid #fff9;border-radius:19px;background:#fffdf5e8;color:#2d6173;font-size:clamp(16px,4.5vw,21px);font-weight:800;line-height:1.35;letter-spacing:-.035em;box-shadow:0 3px 0 #4d8b9725,0 8px 22px #36748912;transform:translate(-50%,-50%);white-space:nowrap;will-change:transform,opacity;transition:background .2s,border-color .2s,box-shadow .2s}
.word.long{white-space:normal;max-width:calc(100% - 36px);width:max-content;font-size:clamp(15px,4.1vw,19px);text-wrap:balance}.word.lock{background:#fff7d9;border-color:#ffcf69;box-shadow:0 0 0 3px #ffda7477,0 4px 0 #c99d3940}.word .typed{color:#d89d38}.word .part{color:#e8b859;text-decoration:underline;text-underline-offset:4px}.word.wait{opacity:.78;font-size:clamp(14px,4vw,18px)}
#dock{position:absolute;left:16px;right:16px;bottom:calc(15px + var(--safeB));z-index:12;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;pointer-events:none}
#lesson{margin:0 0 9px;text-align:center;font-size:12px;color:#225568;font-weight:650;text-shadow:0 1px 0 #fff8;min-height:16px;transition:opacity .8s}
#entry{display:flex;align-items:center;gap:5px;background:#fffef8;border:3px solid #ffffffe8;border-radius:20px;box-shadow:0 4px 0 #2e62742b,0 7px 26px #26566916;padding:3px 6px 3px 1px;transition:border-color .2s,box-shadow .2s}
#entry:focus-within{border-color:#ffd376;box-shadow:0 4px 0 #b28a3c3b,0 0 0 3px #fff3}
#input{border:0;outline:0!important;flex:1;width:0;min-width:0;padding:12px 10px 12px 15px;font-size:18px;font-weight:700;background:transparent;color:#26576a;letter-spacing:-.025em;user-select:text;-webkit-user-select:text;caret-color:#d29130}#input::placeholder{font-weight:500;font-size:15px;color:#91a8ac}#input[readonly]{caret-color:transparent}
#clear.ready{background:#ffd36f;color:#79551e;font-weight:900}
#clear{border:0;background:#e9f2f0;color:#719396;border-radius:50%;width:31px;height:31px;font-size:20px;display:grid;place-items:center;padding:0;margin:0 3px}
#energy{position:relative;height:7px;border-radius:9px;background:#f5faf895;margin:13px 4px 0;overflow:hidden;box-shadow:0 1px 0 #54899322}#energyFill{height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#62c8a7,#b5edb1);transition:width .16s linear,background .6s;position:relative}#energy.tired #energyFill{background:linear-gradient(90deg,#f1ad51,#f8d677)}#energy.critical #energyFill{background:linear-gradient(90deg,#cb3d50,#f77973)}#energy.critical{box-shadow:0 0 0 1px #bc4d4640,0 0 9px #e7684140}#energyFill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff0,#fff8,#fff0);animation:gleam 2.4s infinite;transform:translateX(-100%)}@keyframes gleam{to{transform:translateX(100%)}}
#cheer{position:absolute;z-index:10;left:50%;top:min(78%,calc(var(--dockTop) - 40px));text-align:center;pointer-events:none;opacity:0;white-space:nowrap;font-weight:950;color:#fff8d4;font-size:27px;-webkit-text-stroke:1px #ba7d2a;paint-order:stroke fill;text-shadow:0 3px 0 #25526666;transform:translate(-50%,-50%)}
#cheer.pop{animation:cheer .95s both}@keyframes cheer{0%{opacity:0;transform:translate(-50%,-35%) scale(.7) rotate(-7deg)}16%{opacity:1;transform:translate(-50%,-60%) scale(1.18) rotate(-4deg)}34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(.96)}}
#flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 58%,#fffbe4b0,#fff4 30%,#fff0 65%)}
#lens{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:9}.lensdrop{position:absolute;width:13px;height:20px;border-radius:55% 45% 47% 53%;background:linear-gradient(135deg,#fffa,#ffffff00 45%,#80cbe04a);border:1px solid #fff6;box-shadow:inset 1px 2px 2px #fff8;animation:lens 1s ease-in forwards}@keyframes lens{0%{opacity:0;transform:scale(.4)}12%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:translateY(50px) scale(.85)}}
#endActions{position:absolute;left:14px;right:14px;bottom:calc(22px + var(--safeB));z-index:18;text-align:center;opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s}#resultCard{max-width:420px;margin:0 auto;padding:18px 18px 15px;border-radius:28px;background:linear-gradient(180deg,#fffcf3f0,#f5ffffef);border:1px solid #ffffffd9;box-shadow:0 18px 50px #214d5b21,0 4px 0 #ffffffb5;backdrop-filter:blur(8px)}#resultCard .result-kicker{display:inline-block;padding:6px 11px;border-radius:999px;background:#e8f7f7;color:#4d7b86;font-size:10px;font-weight:900;letter-spacing:.16em}#resultCard h2{margin:11px 0 5px;color:#214f64;font-size:clamp(24px,6vw,34px);line-height:1.05;letter-spacing:-.055em}#resultSub{color:#63828b;font-size:12px;font-weight:700;margin-bottom:13px}#killMarks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:34px;padding:4px 0 10px}#killMarks .mark{width:26px;height:16px;border-radius:55% 50% 48% 60%;background:linear-gradient(180deg,#5eb4ba,#2f6f89);position:relative;transform:rotate(-7deg)}#killMarks .mark:before{content:'';position:absolute;right:-6px;top:4px;width:7px;height:7px;background:inherit;clip-path:polygon(0 50%,100% 0,100% 100%)}#killMarks .mark:after{content:'';position:absolute;left:6px;top:5px;width:12px;height:5px;border-radius:999px;background:#fff5d7cc}#killMarks .more{align-self:center;padding:6px 9px;border-radius:999px;background:#ebf5f4;color:#49707b;font-size:11px;font-weight:900}.resultButtons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#endActions button{border:1px solid #d0dbdca3;border-radius:999px;padding:12px 18px;font-size:14px;background:#f1f5f5d8;color:#486975;box-shadow:none;font-weight:850;letter-spacing:-.02em}#endActions #again{background:linear-gradient(#ffd974,#ffc14a);border-color:#ffe8a7;color:#6f4a1e;box-shadow:0 4px 0 #ce9140}#endActions .ghost{background:#ffffffd7;color:#496d78}#endActions.show{opacity:1;visibility:visible}
#status{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;background:#e5f2f1f5;color:#315867;font-size:15px;line-height:1.8;white-space:pre-line}#status.show{display:flex}#status button{border:0;border-radius:12px;padding:10px 20px;margin-top:16px;background:#ffcf6b;color:#4c5344;font-weight:800}
#resume{position:absolute;inset:0;z-index:40;border:0;background:#e2f1f073;color:#2c6070;font-size:18px;font-weight:800;backdrop-filter:blur(3px);display:none}#resume.show{display:block}
#app.play #hud{opacity:1}#app.play #dock{opacity:1;visibility:visible;pointer-events:auto}
#app.ending{background:linear-gradient(180deg,#d3dfdf,#e8edeb 65%,#abc3c4)}
#app.ending #hud,#app.ending #dock{opacity:0;visibility:hidden;pointer-events:none}#app.ending #sky{opacity:.22}#app.ending #vignette{box-shadow:inset 0 0 90px #53686e30;background:linear-gradient(180deg,#fff0 50%,#70899020)}
#app.compact #lesson{display:block;position:absolute;left:0;right:0;bottom:100%;margin:0 0 7px;pointer-events:none}#app.compact #dock{bottom:calc(8px + var(--safeB))}#app.compact #energy{margin-top:8px;height:5px}#app.compact #entry{border-radius:16px}#app.compact #input{padding:9px 11px;font-size:17px}#app.compact #tools{top:7px}#app.compact #hud{top:14px}#app.compact .word{padding:7px 15px;font-size:16px;border-radius:14px}#app.compact .word.wait{font-size:14px}
@media(min-width:900px){body{background:radial-gradient(ellipse at 50% 25%,#d5eeee,#94c9d3)}#app{box-shadow:0 0 100px #376c7730}#app:before{content:"";position:absolute;inset:0;border-left:1px solid #fff3;border-right:1px solid #fff3;pointer-events:none;z-index:55}}
@media(max-height:550px){#logo{top:8%}.kicker{display:none}h1 span{font-size:43px;-webkit-text-stroke-width:5px}h1 strong{font-size:34px;-webkit-text-stroke-width:4px}.logo-star{display:none}#startArea{bottom:6%}.bigbtn{min-height:46px;font-size:18px;padding:8px 37px;border-radius:16px}#startArea p{font-size:12px;margin-bottom:9px}#introHint{display:none}}
@media(prefers-reduced-motion:reduce){.cloud,h1,#energyFill:after{animation:none}*{scroll-behavior:auto!important}}
#endActions:not(.show){transition:none}#killMarks .mark{background:none;box-shadow:none;width:30px;height:25px;transform:none}#killMarks .mark:before,#killMarks .mark:after{display:none}#killMarks .mark svg{display:block;width:100%;height:100%}.mixTitle{font-size:12px;font-weight:900;padding:8px 10px}.mixRow{display:flex;align-items:center;gap:12px;padding:7px 10px;font-size:12px;font-weight:700}.mixRow input{width:118px;accent-color:#3f8896}#settings{max-height:calc(var(--vh) - 76px);overflow:auto}#app.showtime #sky{opacity:.26}#app.showtime{background:linear-gradient(#395b7e,#8cbdcb 52%,#9bdcdf)}#endActions #recordClose{display:none}#endActions.inspect #again{display:none}#endActions.inspect #recordClose{display:inline-block}#endActions.inspect{z-index:41}#app.compact #resultCard{padding:10px 12px}#app.compact #resultCard h2{font-size:25px}#app.compact #resultSub{margin-bottom:5px}#app.compact #killMarks{max-height:44px;overflow:hidden}#resultCard h2{overflow-wrap:anywhere}#endActions button{padding:11px 14px}
</style>
</head>
<body>
<main id="app" aria-label="고래 칭찬하기">
<div id="sky" aria-hidden="true"><div class="sun"></div><div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div></div>
<canvas id="scene" aria-label="바다 위의 고래"></canvas><div id="vignette"></div>
<a id="arcadeFace" href="https://aaffffffffff123-lang.github.io/arcade/" target="_top" aria-label="혐규오락실 — 다른 게임 하러 가기" title="혐규오락실">
<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24.00 2.84 C27.19 2.93 30.48 3.49 33.44 4.70 C36.39 5.91 39.79 7.65 41.72 10.08 C43.64 12.51 44.41 16.18 44.97 19.28 C45.53 22.39 45.73 25.72 45.08 28.74 C44.42 31.76 43.07 35.11 41.06 37.40 C39.05 39.69 35.87 41.15 33.03 42.47 C30.19 43.79 27.09 45.14 24.00 45.31 C20.91 45.47 17.40 44.72 14.49 43.46 C11.58 42.19 8.30 40.21 6.54 37.72 C4.78 35.22 4.45 31.57 3.93 28.51 C3.41 25.45 2.76 22.23 3.42 19.37 C4.08 16.52 6.10 13.90 7.91 11.36 C9.72 8.82 11.61 5.56 14.29 4.14 C16.97 2.72 20.81 2.75 24.00 2.84 Z" fill="#221D1F"/><g stroke="#EFF1EC" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M13.2 8.4V17.9"/><path d="M20.4 6.2V16.6"/><path d="M27.6 6.2V16.6"/><path d="M34.6 8.8V18.3"/></g><g fill="#EFF1EC"><ellipse cx="18.1" cy="25.2" rx="2" ry="2.3"/><ellipse cx="29.9" cy="25.2" rx="2" ry="2.3"/></g><path d="M19.9 32.3a4.6 4.6 0 0 0 8.2 0" fill="none" stroke="#EFF1EC" stroke-width="2.3" stroke-linecap="round"/></svg></a>
<div id="tools"><button class="iconbtn" id="sound" aria-label="소리 끄기" title="소리"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path id="soundWaves" d="M15 8q4 4 0 8m3-11q7 7 0 14"/></svg></button><button class="iconbtn" id="gear" aria-label="설정" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-.6 2.2-2 .9-2-.7L3 9l1.6 1.5v3L3 15l2.4 3.6 2-.7 2 .9L10 21h4l.6-2.2 2-.9 2 .7L21 15l-1.6-1.5v-3L21 9l-2.4-3.6-2 .7-2-.9L14 3Z"/></svg></button></div>
<div id="settings" hidden><div class="mixTitle">소리 조절</div><label class="mixRow">음악<input id="mixMusic" type="range" min="0" max="100" aria-label="음악 음량"></label><label class="mixRow">물소리<input id="mixWater" type="range" min="0" max="100" aria-label="물소리 음량"></label><label class="mixRow">효과음<input id="mixEffects" type="range" min="0" max="100" aria-label="효과음 음량"></label><button id="motion">화면 효과 줄이기</button><button id="recordOpen">칭찬 기록 보기</button><button id="restart">처음 화면으로</button><button id="clearRecord">누적 기록 초기화</button></div>
<section id="intro"><div id="logo"><div class="kicker">좋은 말은 언제나 힘이 돼요</div><h1><span>고래</span><strong>칭찬하기</strong></h1><span class="logo-star">✦</span></div><div id="startArea"><p>좋은 말 한마디를 들려 주세요.</p><button class="bigbtn" id="start"><span class="star">✦</span>칭찬하기</button><span id="introHint">칭찬은 고래도 춤추게 해요.</span></div></section>
<div id="hud"><span class="heart">♥</span><span>칭찬</span><b id="score">0</b></div>

    }

            moonScreen:()=>moonProjection(),
            pause(v) { paused = v; }, limits: CONFIG, project(p) { let q = M.transform(cam.vp, p), m = cam.vp, w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15]; return [(q[0] / w * .5 + .5) * W, (.5 - q[1] / w * .5) * H]; }, glError: () => gl.getError()
        };
})();
</script>
